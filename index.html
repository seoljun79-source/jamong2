      function renderToast() {
        if (!state.toast) return '';
        const bg =
          state.toast.type === 'success'
            ? 'bg-emerald-600 text-white'
            : state.toast.type === 'error'
            ? 'bg-rose-600 text-white'
            : 'bg-slate-900 text-white';
        return `
          <div class="fixed bottom-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-bold ${bg} animate-fade-in">
            ${esc(state.toast.message)}
          </div>
        `;
      }

      /* =========================================================================
       * 8. MASTER RENDER FUNCTION
       * ========================================================================= */
      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;
        const ws = getCurrentWorkspace();

        let screenHtml = '';

        // 1. Real Student Distribution Mode (?mode=student)
        if (state.isStudentUrlMode && !state.isTeacherAuthenticated) {
          screenHtml = renderStudentSurveyScreen(ws) + renderSecretPinModal(ws);
        }
        // 2. Teacher Not Authenticated (Normal URL without ?mode=student)
        else if (!state.isTeacherAuthenticated) {
          screenHtml = renderWorkspaceGate();
        }
        // 3. Authenticated Teacher Previewing Student Screen (previewStudentMode === true)
        else if (state.previewStudentMode) {
          screenHtml = renderStudentSurveyScreen(ws);
        }
        // 4. Authenticated Teacher Full Management Dashboard
        else {
          screenHtml = renderTeacherDashboard(ws) + renderFirebaseModal();
        }

        root.innerHTML = screenHtml + renderToast();
      }

      /* =========================================================================
       * 9. CENTRALIZED EVENT DELEGATION ON #app-root (ZERO INLINE HANDLERS)
       * ========================================================================= */
      const appRoot = document.getElementById('app-root');

      function openSecretTeacherPinModal() {
        state.showSecretPinModal = true;
        state.secretPinInput = '';
        state.secretPinError = '';
        render();
        setTimeout(() => {
          const inp = document.getElementById('secret-pin-field');
          if (inp) inp.focus();
        }, 40);
      }

      function verifySecretTeacherPin() {
        const ws = getCurrentWorkspace();
        if (state.secretPinInput.trim() === ws.pin) {
          state.showSecretPinModal = false;
          state.secretPinError = '';
          state.isTeacherAuthenticated = true;
          state.isStudentUrlMode = false;
          state.previewStudentMode = false;
          try {
            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('mode');
            window.history.replaceState({}, '', cleanUrl.toString());
          } catch (e) {
            // Safe ignore in restricted iframe environments
          }
          render();
          showToast(`🔓 ${ws.name} 담임교사 관리 화면으로 전환되었습니다.`, 'success');
        } else {
          state.secretPinError = 'PIN 번호가 일치하지 않습니다. 다시 확인해 주세요.';
          render();
        }
      }

      // Click Delegation
      appRoot.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;

        const action = target.getAttribute('data-action');
        const ws = getCurrentWorkspace();

        switch (action) {
          /* --- Secret Escape Hatch in ?mode=student --- */
          case 'secret-badge-tap': {
            if (!state.isStudentUrlMode) return;
            state.secretTapCount += 1;
            if (state.secretTapTimer) clearTimeout(state.secretTapTimer);
            state.secretTapTimer = setTimeout(() => {
              state.secretTapCount = 0;
            }, 3000);
            if (state.secretTapCount >= 5) {
              state.secretTapCount = 0;
              openSecretTeacherPinModal();
            }
            break;
          }
          case 'close-secret-pin-modal': {
            state.showSecretPinModal = false;
            render();
            break;
          }
          case 'submit-secret-pin': {
            verifySecretTeacherPin();
            break;
          }

          /* --- Teacher Preview Mode Toggle (ONLY available to authenticated teachers) --- */
          case 'enter-preview-mode': {
            if (!state.isTeacherAuthenticated) return;
            state.previewStudentMode = true;
            state.surveyStep = 1;
            state.surveySearch = '';
            state.surveyForm = {
              studentId: '',
              prefer: ['', '', ''],
              avoid: ['', '', ''],
              bestStudentId: '',
              bestBadge: '다정·배려왕',
              message: ''
            };
            render();
            break;
          }
          case 'exit-preview-mode': {
            state.previewStudentMode = false;
            render();
            break;
          }

          /* --- Workspace Gate Actions --- */
          case 'gate-switch-tab': {
            state.gateTab = target.getAttribute('data-tab') || 'login';
            state.loginError = '';
            state.createError = '';
            render();
            break;
          }
          case 'gate-select-class': {
            state.loginClassCode = target.getAttribute('data-code') || '';
            state.loginError = '';
            render();
            break;
          }
          case 'gate-submit-login': {
            const code = (state.loginClassCode || '').toUpperCase().trim();
            const found = state.workspaces[code];
            if (!found) {
              state.loginError = '존재하지 않는 학급 코드입니다.';
              render();
              return;
            }
            if (String(state.loginPin).trim() !== String(found.pin)) {
              state.loginError = '담임교사 PIN 번호가 올바르지 않습니다.';
              render();
              return;
            }
            state.activeClassCode = code;
            state.isTeacherAuthenticated = true;
            state.previewStudentMode = false;
            state.loginPin = '';
            state.loginError = '';
            persistCurrentWorkspace();
            render();
            showToast(`👋 ${found.name} 관리 대시보드에 오신 것을 환영합니다!`, 'success');
            break;
          }
          case 'gate-demo-quick-login': {
            if (!state.workspaces[DEMO_CLASS_CODE]) {
              state.workspaces[DEMO_CLASS_CODE] = createDefaultWorkspace();
            }
            state.activeClassCode = DEMO_CLASS_CODE;
            state.isTeacherAuthenticated = true;
            state.previewStudentMode = false;
            persistCurrentWorkspace();
            render();
            showToast('⚡ 기본 체험 반(MODU2026)으로 즉시 입장했습니다.', 'success');
            break;
          }
          case 'gate-submit-create': {
            const code = (state.newClassCode || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
            const name = (state.newClassName || '').trim();
            const pin = (state.newClassPin || '').trim();
            if (!code || code.length < 3) {
              state.createError = '학급 코드는 영문/숫자 3자 이상 입력해 주세요.';
              render();
              return;
            }
            if (state.workspaces[code]) {
              state.createError = '이미 사용 중인 학급 코드입니다.';
              render();
              return;
            }
            if (!name) {
              state.createError = '학급명을 입력해 주세요.';
              render();
              return;
            }
            if (pin.length < 4) {
              state.createError = 'PIN 번호는 4자리 이상으로 설정해 주세요.';
              render();
              return;
            }

            const newWs = createDefaultWorkspace(code, name, pin, false);
            const lines = (state.newClassRosterText || '').split('\n').map((l) => l.trim()).filter(Boolean);
            lines.forEach((line, idx) => {
              const parts = line.split(/\s+/);
              const parsedNum = parseInt(parts[0], 10);
              const num = !isNaN(parsedNum) ? parsedNum : idx + 1;
              const stName = !isNaN(parsedNum) ? parts.slice(1).join(' ') : line;
              if (stName) {
                newWs.students.push({
                  id: `st_${Date.now()}_${idx}`,
                  num,
                  name: stName,
                  gender: idx % 2 === 0 ? 'M' : 'F',
                  grade: '중',
                  role: 'normal',
                  note: ''
                });
              }
            });
            resizeSeatingGrid(newWs, 'single', 5, 6);
            newWs.students.forEach((st, i) => {
              const r = Math.floor(i / 5);
              const c = i % 5;
              if (r < 6 && c < 5) newWs.seating.grid[r][c] = st.id;
            });

            state.workspaces[code] = newWs;
            state.activeClassCode = code;
            state.isTeacherAuthenticated = true;
            state.previewStudentMode = false;
            persistCurrentWorkspace();
            render();
            showToast(`🎉 ${name} (${code}) 학급이 개설되었습니다!`, 'success');
            break;
          }

          /* --- Teacher Header Actions --- */
          case 'teacher-logout': {
            state.isTeacherAuthenticated = false;
            state.previewStudentMode = false;
            state.loginClassCode = ws.code;
            state.loginPin = '';
            render();
            break;
          }
          case 'switch-tab': {
            state.activeTab = target.getAttribute('data-tab') || 'seating';
            state.graphFullscreen = false;
            render();
            break;
          }
          case 'copy-student-link': {
            const url = buildStudentShareUrl(ws.code);
            copyTextSafely(url, '📋 학생 배포용 링크(?mode=student)가 복사되었습니다! 패들렛에 붙여넣으세요.');
            break;
          }
          case 'open-firebase-modal': {
            state.showFirebaseModal = true;
            render();
            break;
          }
          case 'close-firebase-modal': {
            state.showFirebaseModal = false;
            render();
            break;
          }
          case 'save-firebase-config': {
            try {
              localStorage.setItem(STORAGE_KEY_FIREBASE_CFG, JSON.stringify(state.firebaseConfig));
            } catch (e) {
              // ignore
            }
            syncToCloudIfEnabled();
            state.showFirebaseModal = false;
            render();
            showToast('☁️ 클라우드 동기화 설정이 저장되었습니다.', 'success');
            break;
          }

          /* --- Student 3-Step Survey Actions --- */
          case 'survey-select-student': {
            const stId = target.getAttribute('data-student-id');
            if (!stId) return;
            const existing = ws.surveys[stId];
            state.surveyForm = existing
              ? {
                  studentId: stId,
                  prefer: [...(existing.prefer || ['', '', ''])],
                  avoid: [...(existing.avoid || ['', '', ''])],
                  bestStudentId: existing.bestStudentId || '',
                  bestBadge: existing.bestBadge || '다정·배려왕',
                  message: existing.message || ''
                }
              : {
                  studentId: stId,
                  prefer: ['', '', ''],
                  avoid: ['', '', ''],
                  bestStudentId: '',
                  bestBadge: '다정·배려왕',
                  message: ''
                };
            render();
            break;
          }
          case 'survey-next-step': {
            const nextStep = parseInt(target.getAttribute('data-target-step'), 10);
            if (nextStep === 2 && !state.surveyForm.studentId) {
              showToast('먼저 본인의 학번과 이름을 선택해 주세요.', 'error');
              return;
            }
            state.surveyStep = nextStep;
            render();
            break;
          }
          case 'survey-prev-step': {
            const prevStep = parseInt(target.getAttribute('data-target-step'), 10);
            state.surveyStep = prevStep;
            render();
            break;
          }
          case 'survey-select-badge': {
            state.surveyForm.bestBadge = target.getAttribute('data-badge') || '다정·배려왕';
            render();
            break;
          }
          case 'survey-submit': {
            const f = state.surveyForm;
            if (!f.studentId) {
              showToast('학생 정보가 선택되지 않았습니다.', 'error');
              return;
            }
            ws.surveys[f.studentId] = {
              studentId: f.studentId,
              prefer: [f.prefer[0] || '', f.prefer[1] || '', f.prefer[2] || ''],
              avoid: [f.avoid[0] || '', f.avoid[1] || '', f.avoid[2] || ''],
              bestStudentId: f.bestStudentId || '',
              bestBadge: f.bestBadge || '다정·배려왕',
              message: (f.message || '').trim(),
              updatedAt: new Date().toLocaleString('ko-KR')
            };
            persistCurrentWorkspace();
            state.surveyStep = 4;
            render();
            break;
          }
          case 'survey-reset-for-next': {
            state.surveyStep = 1;
            state.surveySearch = '';
            state.surveyForm = {
              studentId: '',
              prefer: ['', '', ''],
              avoid: ['', '', ''],
              bestStudentId: '',
              bestBadge: '다정·배려왕',
              message: ''
            };
            render();
            break;
          }

          /* --- Seating Studio Actions --- */
          case 'seating-set-mode': {
            const newMode = target.getAttribute('data-mode');
            const defaultCols = newMode === 'pair' ? 6 : 5;
            resizeSeatingGrid(ws, newMode, defaultCols, ws.seating.rows);
            state.selectedSeat = null;
            persistCurrentWorkspace();
            render();
            break;
          }
          case 'seating-toggle-pin': {
            e.stopPropagation();
            const stId = target.getAttribute('data-student-id');
            if (!stId) return;
            if (ws.seating.pinned[stId]) {
              delete ws.seating.pinned[stId];
            } else {
              ws.seating.pinned[stId] = true;
            }
            persistCurrentWorkspace();
            render();
            break;
          }
          case 'seating-click-cell': {
            const r = parseInt(target.getAttribute('data-row'), 10);
            const c = parseInt(target.getAttribute('data-col'), 10);
            if (isNaN(r) || isNaN(c)) return;

            if (!state.selectedSeat) {
              state.selectedSeat = { r, c };
              render();
              return;
            }

            // If unplaced student was selected first -> place into (r, c)
            if (state.selectedSeat.unplacedId) {
              ws.seating.grid[r][c] = state.selectedSeat.unplacedId;
              state.selectedSeat = null;
              persistCurrentWorkspace();
              render();
              return;
            }

            // Swap (r1, c1) and (r, c)
            const { r: r1, c: c1 } = state.selectedSeat;
            if (r1 === r && c1 === c) {
              state.selectedSeat = null;
              render();
              return;
            }
            const temp = ws.seating.grid[r1][c1];
            ws.seating.grid[r1][c1] = ws.seating.grid[r][c];
            ws.seating.grid[r][c] = temp;
            state.selectedSeat = null;
            persistCurrentWorkspace();
            render();
            break;
          }
          case 'seating-click-unplaced': {
            const stId = target.getAttribute('data-student-id');
            if (!stId) return;
            if (state.selectedSeat && typeof state.selectedSeat.r === 'number') {
              const { r, c } = state.selectedSeat;
              ws.seating.grid[r][c] = stId;
              state.selectedSeat = null;
              persistCurrentWorkspace();
              render();
            } else {
              state.selectedSeat =
                state.selectedSeat && state.selectedSeat.unplacedId === stId ? null : { unplacedId: stId };
              render();
            }
            break;
          }
          case 'seating-optimize': {
            const strategy = target.getAttribute('data-strategy') || 'mentor';
            runSimulatedAnnealing(ws, strategy);
            break;
          }
          case 'seating-toggle-tv-hide': {
            state.tvHideSensitive = !state.tvHideSensitive;
            render();
            break;
          }
          case 'seating-export-csv': {
            exportSeatingCsv(ws);
            break;
          }
          case 'seating-print': {
            window.print();
            break;
          }

          /* --- Relationship Graph Actions --- */
          case 'graph-set-filter': {
            state.graphFilter = target.getAttribute('data-filter') || 'all';
            render();
            break;
          }
          case 'graph-rearrange': {
            computeForceGraphPositions(ws, true);
            render();
            showToast('✨ 180회 물리 정돈 알고리즘으로 노드 배치를 최적화했습니다.', 'success');
            break;
          }
          case 'graph-zoom-delta': {
            const delta = parseInt(target.getAttribute('data-delta'), 10) || 0;
            state.graphZoom = Math.max(80, Math.min(150, state.graphZoom + delta));
            render();
            break;
          }
          case 'graph-toggle-fullscreen': {
            state.graphFullscreen = !state.graphFullscreen;
            render();
            break;
          }
          case 'graph-export-png': {
            exportRelationshipPng2880x1920(ws);
            break;
          }
          case 'graph-select-node': {
            const stId = target.getAttribute('data-student-id');
            state.selectedGraphStudentId = state.selectedGraphStudentId === stId ? null : stId;
            render();
            break;
          }
          case 'graph-close-diagnostic': {
            state.selectedGraphStudentId = null;
            render();
            break;
          }

          /* --- Roster Add / Delete --- */
          case 'roster-add-student': {
            const name = (state.rosterNewName || '').trim();
            if (!name) {
              showToast('추가할 학생 이름을 입력해 주세요.', 'error');
              return;
            }
            const maxNum = ws.students.reduce((m, s) => Math.max(m, s.num), 0);
            const num = parseInt(state.rosterNewNum, 10) || maxNum + 1;
            const newSt = {
              id: `st_${Date.now()}`,
              num,
              name,
              gender: 'M',
              grade: state.rosterNewGrade || '중',
              role: state.rosterNewRole || 'normal',
              note: ''
            };
            ws.students.push(newSt);

            // Place in first open seat if available
            let placed = false;
            for (let r = 0; r < ws.seating.rows && !placed; r++) {
              for (let c = 0; c < ws.seating.cols && !placed; c++) {
                if (!ws.seating.grid[r][c]) {
                  ws.seating.grid[r][c] = newSt.id;
                  placed = true;
                }
              }
            }
            state.rosterNewNum = '';
            state.rosterNewName = '';
            persistCurrentWorkspace();
            render();
            showToast(`✅ ${num}번 ${name} 학생이 명단에 추가되었습니다.`, 'success');
            break;
          }
          case 'roster-delete-student': {
            const stId = target.getAttribute('data-student-id');
            ws.students = ws.students.filter((s) => s.id !== stId);
            delete ws.surveys[stId];
            delete ws.seating.pinned[stId];
            for (let r = 0; r < ws.seating.rows; r++) {
              for (let c = 0; c < ws.seating.cols; c++) {
                if (ws.seating.grid[r][c] === stId) {
                  ws.seating.grid[r][c] = null;
                }
              }
            }
            persistCurrentWorkspace();
            render();
            showToast('학생 정보가 삭제되었습니다.', 'info');
            break;
          }

          /* --- Awards Ceremony Sequential Reveal --- */
          case 'award-set-step': {
            state.awardRevealStep = parseInt(target.getAttribute('data-step'), 10) || 0;
            render();
            break;
          }

          /* --- Archive & Backup Actions --- */
          case 'archive-save-current': {
            const title = (state.archiveTitleInput || '').trim() || `${new Date().toLocaleDateString('ko-KR')} 자리배치`;
            const memo = (state.archiveMemoInput || '').trim();
            ws.archives.unshift({
              id: `arc_${Date.now()}`,
              title,
              date: new Date().toISOString().slice(0, 10),
              memo,
              mode: ws.seating.mode,
              cols: ws.seating.cols,
              rows: ws.seating.rows,
              grid: JSON.parse(JSON.stringify(ws.seating.grid))
            });
            state.archiveTitleInput = '';
            state.archiveMemoInput = '';
            persistCurrentWorkspace();
            render();
            showToast('💾 현재 자리배치가 1년 저장소에 보관되었습니다.', 'success');
            break;
          }
          case 'archive-load': {
            const arcId = target.getAttribute('data-archive-id');
            const found = ws.archives.find((a) => a.id === arcId);
            if (!found) return;
            ws.seating.mode = found.mode;
            ws.seating.cols = found.cols;
            ws.seating.rows = found.rows;
            ws.seating.grid = JSON.parse(JSON.stringify(found.grid));
            ws.seating.lastAlgorithm = `불러온 배치: ${found.title}`;
            state.activeTab = 'seating';
            persistCurrentWorkspace();
            render();
            showToast(`📂 '${found.title}' 배치를 불러왔습니다.`, 'success');
            break;
          }
          case 'archive-delete': {
            const arcId = target.getAttribute('data-archive-id');
            ws.archives = ws.archives.filter((a) => a.id !== arcId);
            persistCurrentWorkspace();
            render();
            showToast('저장된 배치 기록이 삭제되었습니다.', 'info');
            break;
          }
          case 'backup-export-json': {
            const blob = new Blob([JSON.stringify(ws, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `모두의자리_${ws.code}_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('⬇️ 학급 전체 데이터 JSON 백업 파일이 다운로드되었습니다.', 'success');
            break;
          }

          default:
            break;
        }
      });

      // Input & Change Delegation
      appRoot.addEventListener('input', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.getAttribute('data-action');

        switch (action) {
          case 'secret-pin-input':
            state.secretPinInput = target.value;
            break;
          case 'gate-login-code':
            state.loginClassCode = target.value.toUpperCase();
            break;
          case 'gate-login-pin':
            state.loginPin = target.value;
            break;
          case 'gate-new-code':
            state.newClassCode = target.value.toUpperCase();
            break;
          case 'gate-new-name':
            state.newClassName = target.value;
            break;
          case 'gate-new-pin':
            state.newClassPin = target.value;
            break;
          case 'gate-new-roster':
            state.newClassRosterText = target.value;
            break;
          case 'survey-search-input':
            state.surveySearch = target.value;
            render();
            break;
          case 'survey-change-message':
            state.surveyForm.message = target.value;
            break;
          case 'roster-input-num':
            state.rosterNewNum = target.value;
            break;
          case 'roster-input-name':
            state.rosterNewName = target.value;
            break;
          case 'archive-input-title':
            state.archiveTitleInput = target.value;
            break;
          case 'archive-input-memo':
            state.archiveMemoInput = target.value;
            break;
          case 'fb-input-field': {
            const field = target.getAttribute('data-field');
            if (field) state.firebaseConfig[field] = target.value;
            break;
          }
          default:
            break;
        }
      });

      appRoot.addEventListener('change', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.getAttribute('data-action');
        const ws = getCurrentWorkspace();

        switch (action) {
          case 'survey-change-prefer': {
            const rank = parseInt(target.getAttribute('data-rank'), 10);
            state.surveyForm.prefer[rank] = target.value;
            render();
            break;
          }
          case 'survey-change-avoid': {
            const rank = parseInt(target.getAttribute('data-rank'), 10);
            state.surveyForm.avoid[rank] = target.value;
            render();
            break;
          }
          case 'survey-change-best': {
            state.surveyForm.bestStudentId = target.value;
            render();
            break;
          }
          case 'seating-change-cols': {
            const newCols = parseInt(target.value, 10);
            resizeSeatingGrid(ws, ws.seating.mode, newCols, ws.seating.rows);
            persistCurrentWorkspace();
            render();
            break;
          }
          case 'seating-change-rows': {
            const newRows = parseInt(target.value, 10);
            resizeSeatingGrid(ws, ws.seating.mode, ws.seating.cols, newRows);
            persistCurrentWorkspace();
            render();
            break;
          }
          case 'roster-input-grade':
            state.rosterNewGrade = target.value;
            break;
          case 'roster-input-role':
            state.rosterNewRole = target.value;
            break;
          case 'roster-update-grade': {
            const st = getStudentById(ws, target.getAttribute('data-student-id'));
            if (st) {
              st.grade = target.value;
              persistCurrentWorkspace();
              render();
            }
            break;
          }
          case 'roster-update-role': {
            const st = getStudentById(ws, target.getAttribute('data-student-id'));
            if (st) {
              st.role = target.value;
              persistCurrentWorkspace();
              render();
            }
            break;
          }
          case 'fb-toggle-enabled':
            state.firebaseConfig.enabled = Boolean(target.checked);
            break;
          case 'backup-import-json': {
            const file = target.files && target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const imported = JSON.parse(ev.target.result);
                if (!imported || !imported.code || !Array.isArray(imported.students) || !imported.seating) {
                  showToast('올바른 모두의자리 JSON 백업 파일이 아닙니다.', 'error');
                  return;
                }
                const code = imported.code.toUpperCase();
                state.workspaces[code] = imported;
                state.activeClassCode = code;
                persistCurrentWorkspace();
                render();
                showToast(`✅ '${imported.name}' 백업 데이터가 복원되었습니다!`, 'success');
              } catch (err) {
                showToast('JSON 파일을 읽는 중 오류가 발생했습니다.', 'error');
              }
            };
            reader.readAsText(file);
            break;
          }
          default:
            break;
        }
      });

      // Drag & Drop Delegation for Seating Studio
      appRoot.addEventListener('dragstart', (e) => {
        const cell = e.target.closest('[data-action="seating-click-cell"]');
        if (cell) {
          state.dragSource = {
            type: 'grid',
            r: parseInt(cell.getAttribute('data-row'), 10),
            c: parseInt(cell.getAttribute('data-col'), 10)
          };
          return;
        }
        const unp = e.target.closest('[data-action="seating-click-unplaced"]');
        if (unp) {
          state.dragSource = {
            type: 'unplaced',
            studentId: unp.getAttribute('data-student-id')
          };
        }
      });

      appRoot.addEventListener('dragover', (e) => {
        const dropZone = e.target.closest('[data-drop-row]');
        if (dropZone) {
          e.preventDefault();
        }
      });

      appRoot.addEventListener('drop', (e) => {
        const dropZone = e.target.closest('[data-drop-row]');
        if (!dropZone || !state.dragSource) return;
        e.preventDefault();

        const ws = getCurrentWorkspace();
        const r2 = parseInt(dropZone.getAttribute('data-drop-row'), 10);
        const c2 = parseInt(dropZone.getAttribute('data-drop-col'), 10);

        if (state.dragSource.type === 'grid') {
          const { r: r1, c: c1 } = state.dragSource;
          if (r1 !== r2 || c1 !== c2) {
            const tmp = ws.seating.grid[r1][c1];
            ws.seating.grid[r1][c1] = ws.seating.grid[r2][c2];
            ws.seating.grid[r2][c2] = tmp;
            persistCurrentWorkspace();
          }
        } else if (state.dragSource.type === 'unplaced') {
          ws.seating.grid[r2][c2] = state.dragSource.studentId;
          persistCurrentWorkspace();
        }

        state.dragSource = null;
        state.selectedSeat = null;
        render();
      });

      // Global Keyboard Shortcuts (Ctrl+Shift+L in ?mode=student, Enter in PIN modal, Esc)
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
          if (state.isStudentUrlMode && !state.isTeacherAuthenticated) {
            e.preventDefault();
            openSecretTeacherPinModal();
          }
        } else if (e.key === 'Enter' && state.showSecretPinModal) {
          e.preventDefault();
          verifySecretTeacherPin();
        } else if (e.key === 'Escape') {
          if (state.showSecretPinModal) {
            state.showSecretPinModal = false;
            render();
          } else if (state.graphFullscreen) {
            state.graphFullscreen = false;
            render();
          }
        }
      });

      /* =========================================================================
       * 10. INITIAL BOOTSTRAP
       * ========================================================================= */
      render();
    })();
  </script>
</body>
</html>
