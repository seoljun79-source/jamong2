      function createDefaultWorkspace(code = DEMO_CLASS_CODE, name = '2학년 3반 (체험 학급)', pin = DEMO_CLASS_PIN, withDemoData = true) {
        const students = withDemoData ? JSON.parse(JSON.stringify(INITIAL_DEMO_STUDENTS)) : [];
        const surveys = withDemoData ? JSON.parse(JSON.stringify(INITIAL_DEMO_SURVEYS)) : {};
        const cols = 5;
        const rows = 6;
        const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
        const pinned = {};

        if (withDemoData) {
          students.forEach((st, idx) => {
            const r = Math.floor(idx / cols);
            const c = idx % cols;
            if (r < rows && c < cols) {
              grid[r][c] = st.id;
            }
          });
          // Pin 2 students in front row as example
          pinned['s07'] = true;
          pinned['s14'] = true;
        }

        return {
          code: code.toUpperCase().trim(),
          name: name.trim(),
          pin: String(pin).trim(),
          createdAt: new Date().toISOString().slice(0, 10),
          students,
          surveys,
          seating: {
            mode: 'single', // 'single' (1인 책상 분단형) | 'pair' (2인 1조 짝꿍형)
            cols,
            rows,
            grid,
            pinned,
            lastAlgorithm: '초기 명단 순 배치'
          },
          archives: withDemoData
            ? [
                {
                  id: 'arc_demo_1',
                  title: '2026년 9월 2학기 첫 자리배치',
                  date: '2026-09-02',
                  memo: '멘토-멘티 짝꿍 매칭 적용 배치 기록',
                  mode: 'pair',
                  cols: 6,
                  rows: 6,
                  grid: (() => {
                    const g = Array.from({ length: 6 }, () => Array(6).fill(null));
                    students.forEach((st, i) => {
                      const r = Math.floor(i / 6);
                      const c = i % 6;
                      if (r < 6 && c < 6) g[r][c] = st.id;
                    });
                    return g;
                  })()
                }
              ]
            : []
        };
      }

      /* =========================================================================
       * 2. URL MODE DETECTION & APPLICATION STATE
       * ========================================================================= */
      const urlParams = new URLSearchParams(window.location.search);
      const initialStudentUrlMode = urlParams.get('mode') === 'student';
      const initialClassParam = (urlParams.get('class') || '').toUpperCase().trim();

      function loadWorkspaces() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_WORKSPACES);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
              return parsed;
            }
          }
        } catch (e) {
          console.warn('Workspace load fallback:', e);
        }
        const initial = {
          [DEMO_CLASS_CODE]: createDefaultWorkspace(DEMO_CLASS_CODE, '2학년 3반 (체험 학급)', DEMO_CLASS_PIN, true)
        };
        saveWorkspaces(initial);
        return initial;
      }

      function saveWorkspaces(workspaces) {
        try {
          localStorage.setItem(STORAGE_KEY_WORKSPACES, JSON.stringify(workspaces));
        } catch (e) {
          console.warn('Workspace save warning:', e);
        }
      }

      function loadFirebaseConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_FIREBASE_CFG);
          return raw ? JSON.parse(raw) : { enabled: false, apiKey: '', authDomain: '', projectId: '', appId: '' };
        } catch (e) {
          return { enabled: false, apiKey: '', authDomain: '', projectId: '', appId: '' };
        }
      }

      const workspaces = loadWorkspaces();
      const savedActiveCode = (localStorage.getItem(STORAGE_KEY_ACTIVE_CLASS) || '').toUpperCase();

        (initialClassParam && workspaces[initialClassParam] && initialClassParam) ||
        (savedActiveCode && workspaces[savedActiveCode] && savedActiveCode) ||

        selectedGraphStudentId: null,

        awardRevealStep: 0, // 0: Ready, 1: 3rd place, 2: 2nd place, 3: 1st place & all messages

        rosterNewName: '',

        // Modals & Cloud Sync

        firebaseConfig: loadFirebaseConfig(),
        firebaseSyncStatus: 'local', // 'local' | 'connected' | 'error'
        toast: null // { message, type: 'success' | 'error' | 'info' }
      };

      /* =========================================================================
       * 3. HELPER UTILITIES (SAFE HTML ESCAPING, TOASTS, CLASS ACCESSORS)
       * ========================================================================= */
      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      let toastTimeout = null;
      function showToast(message, type = 'info') {
        state.toast = { message, type };
        render();
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          state.toast = null;
          render();
        }, 3200);
      }

      function getCurrentWorkspace() {
        if (!state.workspaces[state.activeClassCode]) {
          const firstKey = Object.keys(state.workspaces)[0];
          if (firstKey) {
            state.activeClassCode = firstKey;
          } else {
            state.workspaces[DEMO_CLASS_CODE] = createDefaultWorkspace();
            state.activeClassCode = DEMO_CLASS_CODE;
            saveWorkspaces(state.workspaces);
          }
        }
        return state.workspaces[state.activeClassCode];
      }

      function persistCurrentWorkspace() {
        saveWorkspaces(state.workspaces);
        try {
          localStorage.setItem(STORAGE_KEY_ACTIVE_CLASS, state.activeClassCode);
        } catch (e) {
          // ignore storage quota issues
        }
        syncToCloudIfEnabled();
      }

      function syncToCloudIfEnabled() {
        if (!state.firebaseConfig || !state.firebaseConfig.enabled || !state.firebaseConfig.projectId) {
          state.firebaseSyncStatus = 'local';
          return;
        }
        // Lightweight Firestore REST sync if user configured valid Firebase projectId & apiKey
        const ws = getCurrentWorkspace();
        try {
          const url = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(state.firebaseConfig.projectId)}/databases/(default)/documents/modus_classes/${encodeURIComponent(ws.code)}?key=${encodeURIComponent(state.firebaseConfig.apiKey || '')}`;
          fetch(url, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fields: {
                payload: { stringValue: JSON.stringify(ws) },
                updatedAt: { stringValue: new Date().toISOString() }
              }
            })
          })
            .then((res) => {
              state.firebaseSyncStatus = res.ok ? 'connected' : 'error';
            })
            .catch(() => {
              state.firebaseSyncStatus = 'error';
            });
        } catch (e) {
          state.firebaseSyncStatus = 'error';
        }
      }

      function getStudentById(ws, id) {
        if (!id) return null;
        return ws.students.find((s) => s.id === id) || null;
      }

      function copyTextSafely(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(successMsg, 'success');
        } catch (e) {
          showToast('복사에 실패했습니다. 주소를 직접 선택해 복사해 주세요.', 'error');
        }
        document.body.removeChild(ta);
      }

      function buildStudentShareUrl(classCode) {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('mode', 'student');
          url.searchParams.set('class', classCode);
          return url.toString();
        } catch (e) {
          const base = window.location.href.split('?')[0];
          return `${base}?mode=student&class=${encodeURIComponent(classCode)}`;
        }
      }

      /* =========================================================================
       * 4. SEATING ENGINE: GRID MANAGEMENT, ANALYSIS & 5,000-ITER SIMULATED ANNEALING
       * ========================================================================= */
      function resizeSeatingGrid(ws, newMode, newCols, newRows) {
        const mode = newMode || ws.seating.mode;
        let cols = Math.max(2, Math.min(10, parseInt(newCols, 10) || ws.seating.cols));
        const rows = Math.max(2, Math.min(8, parseInt(newRows, 10) || ws.seating.rows));

        // In pair mode (2인 1조 짝꿍형), ensure even number of columns (minimum 4, e.g., 6 cols = 3 groups)
        if (mode === 'pair' && cols % 2 !== 0) {
          cols = cols < 10 ? cols + 1 : cols - 1;
        }

        const oldGrid = ws.seating.grid || [];
        const newGrid = Array.from({ length: rows }, () => Array(cols).fill(null));
        const overflow = [];

        for (let r = 0; r < oldGrid.length; r++) {
          for (let c = 0; c < (oldGrid[r] || []).length; c++) {
            const stId = oldGrid[r][c];
            if (!stId) continue;
            if (!getStudentById(ws, stId)) continue;
            if (r < rows && c < cols) {
              newGrid[r][c] = stId;
            } else {
              overflow.push(stId);
            }
          }
        }

        // Try placing overflow students into any empty seats in the new grid
        for (let r = 0; r < rows && overflow.length > 0; r++) {
          for (let c = 0; c < cols && overflow.length > 0; c++) {
            if (!newGrid[r][c]) {
              newGrid[r][c] = overflow.shift();
            }
          }
        }

        ws.seating.mode = mode;
        ws.seating.cols = cols;
        ws.seating.rows = rows;
        ws.seating.grid = newGrid;
      }

      function getUnplacedStudents(ws) {
        const placedSet = new Set();
        ws.seating.grid.forEach((row) =>
          row.forEach((id) => {
            if (id) placedSet.add(id);
          })
        );
        return ws.students.filter((s) => !placedSet.has(s.id));
      }

      function getAdjacentPairs(ws) {
        const { mode, cols, rows, grid } = ws.seating;
        const pairs = []; // { a, b, isPartner }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const idA = grid[r]?.[c];
            if (!idA) continue;

            // Right neighbor
            if (c + 1 < cols && grid[r]?.[c + 1]) {
              const idB = grid[r][c + 1];
              const isPartner = mode === 'pair' && c % 2 === 0;
              pairs.push({ a: idA, b: idB, isPartner });
            }
            // Back neighbor
            if (r + 1 < rows && grid[r + 1]?.[c]) {
              const idB = grid[r + 1][c];
              pairs.push({ a: idA, b: idB, isPartner: false });
            }
          }
        }
        return pairs;
      }

      function getSeatAvoidWarnings(ws) {
        const warnings = {}; // { [studentId]: string[] }
        const pairs = getAdjacentPairs(ws);
        pairs.forEach(({ a, b }) => {
          const survA = ws.surveys[a];
          const survB = ws.surveys[b];
          const stA = getStudentById(ws, a);
          const stB = getStudentById(ws, b);
          if (!stA || !stB) return;

          if (survA && Array.isArray(survA.avoid) && survA.avoid.includes(b)) {
            if (!warnings[a]) warnings[a] = [];
            warnings[a].push(`${stB.num}번 ${stB.name} (기피 대상 인접)`);
            if (!warnings[b]) warnings[b] = [];
            warnings[b].push(`${stA.num}번 ${stA.name} 측 기피 인접`);
          } else if (survB && Array.isArray(survB.avoid) && survB.avoid.includes(a)) {
            if (!warnings[b]) warnings[b] = [];
            warnings[b].push(`${stA.num}번 ${stA.name} (기피 대상 인접)`);
            if (!warnings[a]) warnings[a] = [];
            warnings[a].push(`${stB.num}번 ${stB.name} 측 기피 인접`);
          }
        });
        return warnings;
      }

      function computeSeatingReport(ws) {
        const pairs = getAdjacentPairs(ws);
        let preferredMatches = 0;
        let firstChoiceMatches = 0;
        let avoidConflicts = 0;
        let mentorMenteeMatches = 0;

        const seenPrefEdges = new Set();
        const seenAvoidEdges = new Set();

        pairs.forEach(({ a, b, isPartner }) => {
          const stA = getStudentById(ws, a);
          const stB = getStudentById(ws, b);
          const survA = ws.surveys[a];
          const survB = ws.surveys[b];

          if (survA?.prefer?.includes(b)) {
            const key = `${a}->${b}`;
            if (!seenPrefEdges.has(key)) {
              seenPrefEdges.add(key);
              preferredMatches++;
              if (survA.prefer[0] === b) firstChoiceMatches++;
            }
          }
          if (survB?.prefer?.includes(a)) {
            const key = `${b}->${a}`;
            if (!seenPrefEdges.has(key)) {
              seenPrefEdges.add(key);
              preferredMatches++;
              if (survB.prefer[0] === a) firstChoiceMatches++;
            }
          }

          if (survA?.avoid?.includes(b) || survB?.avoid?.includes(a)) {
            const pairKey = [a, b].sort().join('-');
            if (!seenAvoidEdges.has(pairKey)) {
              seenAvoidEdges.add(pairKey);
              avoidConflicts++;
            }
          }

          if (stA && stB) {
            const isMM =
              (stA.role === 'mentor' && stB.role === 'mentee') ||
              (stA.role === 'mentee' && stB.role === 'mentor');
            if (isMM && (ws.seating.mode === 'single' || isPartner)) {
              mentorMenteeMatches++;
            }
          }
        });

        // Grade balance across rows/columns
        const gradeVal = { 상: 3, 중: 2, 하: 1 };
        const rowAverages = [];
        ws.seating.grid.forEach((row) => {
          const vals = row
            .map((id) => getStudentById(ws, id))
            .filter(Boolean)
            .map((s) => gradeVal[s.grade] || 2);
          if (vals.length > 0) {
            rowAverages.push(vals.reduce((acc, v) => acc + v, 0) / vals.length);
          }
        });
        let variance = 0;
        if (rowAverages.length > 1) {
          const mean = rowAverages.reduce((a, b) => a + b, 0) / rowAverages.length;
          variance = rowAverages.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / rowAverages.length;
        }
        const balanceScore = Math.max(55, Math.min(100, Math.round(100 - variance * 65)));

        const totalSurveyRespondents = Object.keys(ws.surveys).length || 1;
        const satisfactionRate = Math.min(100, Math.round((preferredMatches / totalSurveyRespondents) * 100));

        return {
          preferredMatches,
          firstChoiceMatches,
          avoidConflicts,
          mentorMenteeMatches,
          balanceScore,
          satisfactionRate
        };
      }

      function runSimulatedAnnealing(ws, strategy) {
        // strategy: 'mentor' | 'balanced' | 'preferred'
        const { mode, cols, rows, grid, pinned } = ws.seating;
        const totalSlots = rows * cols;
        if (ws.students.length === 0) {
          showToast('배치할 학생 명단이 비어 있습니다.', 'error');
          return;
        }

        // Build flat list of current seats, placing any unplaced students into open seats first
        const flat = [];
        const placedIds = new Set();
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const id = grid[r]?.[c] || null;
            flat.push(id);
            if (id) placedIds.add(id);
          }
        }
        const unplaced = ws.students.filter((s) => !placedIds.has(s.id)).map((s) => s.id);
        for (let i = 0; i < flat.length && unplaced.length > 0; i++) {
          if (!flat[i]) {
            flat[i] = unplaced.shift();
          }
        }

        // Identify movable indices (not pinned)
        const movableIndices = [];
        for (let i = 0; i < totalSlots; i++) {
          const id = flat[i];
          if (!id || !pinned[id]) {
            movableIndices.push(i);
          }
        }

        if (movableIndices.length < 2) {
          showToast('고정되지 않은 자리가 2개 이상 있어야 최적화를 실행할 수 있습니다.', 'info');
          return;
        }

        const studentMap = {};
        ws.students.forEach((s) => {
          studentMap[s.id] = s;
        });
        const gradeNum = { 상: 3, 중: 2, 하: 1 };

        function evaluate(arr) {
          let score = 0;

          for (let r = 0; r < rows; r++) {
            let rowGradeSum = 0;
            let rowCount = 0;

            for (let c = 0; c < cols; c++) {
              const idx = r * cols + c;
              const idA = arr[idx];
              if (!idA) continue;
              const stA = studentMap[idA];
              const survA = ws.surveys[idA];

              if (stA) {
                rowGradeSum += gradeNum[stA.grade] || 2;
                rowCount++;
              }

              // Check right neighbor
              if (c + 1 < cols) {
                const idB = arr[idx + 1];
                if (idB) {
                  const stB = studentMap[idB];
                  const survB = ws.surveys[idB];
                  const isPartner = mode === 'pair' && c % 2 === 0;
                  const weightMult = isPartner ? 1.8 : 1.0;

                  // Avoidance heavy penalty across all strategies
                  if (survA?.avoid?.includes(idB)) {
                    const rank = survA.avoid.indexOf(idB);
                    score -= (rank === 0 ? 550 : rank === 1 ? 400 : 300) * weightMult;
                  }
                  if (survB?.avoid?.includes(idA)) {
                    const rank = survB.avoid.indexOf(idA);
                    score -= (rank === 0 ? 550 : rank === 1 ? 400 : 300) * weightMult;
                  }

                  // Preference reward
                  const prefMult = strategy === 'preferred' ? 2.4 : 1.0;
                  if (survA?.prefer?.includes(idB)) {
                    const rank = survA.prefer.indexOf(idB);
                    score += (rank === 0 ? 95 : rank === 1 ? 65 : 40) * weightMult * prefMult;
                  }
                  if (survB?.prefer?.includes(idA)) {
                    const rank = survB.prefer.indexOf(idA);
                    score += (rank === 0 ? 95 : rank === 1 ? 65 : 40) * weightMult * prefMult;
                  }

                  // Mentor-Mentee pairing reward
                  if (stA && stB) {
                    const isMentorMentee =
                      (stA.role === 'mentor' && stB.role === 'mentee') ||
                      (stA.role === 'mentee' && stB.role === 'mentor');
                    const mentorMult = strategy === 'mentor' ? 3.2 : 0.8;
                    if (isMentorMentee) {
                      score += (mode === 'pair' ? (isPartner ? 130 : 15) : 95) * mentorMult;
                    }
                    // Penalize mentee + mentee sitting as direct partners
                    if (stA.role === 'mentee' && stB.role === 'mentee' && (mode === 'single' || isPartner)) {
                      score -= 45 * mentorMult;
                    }

                    // Balanced grade diversity between partners/neighbors
                    if (strategy === 'balanced' && (mode === 'single' || isPartner)) {
                      const diff = Math.abs((gradeNum[stA.grade] || 2) - (gradeNum[stB.grade] || 2));
                      if (diff === 1) score += 70;
                      else if (diff === 2) score += 45;
                      else score -= 35;
                    }
                  }
                }
              }

              // Check back neighbor (same column, next row)
              if (r + 1 < rows) {
                const idD = arr[(r + 1) * cols + c];
                if (idD) {
                  const survD = ws.surveys[idD];
                  if (survA?.avoid?.includes(idD) || survD?.avoid?.includes(idA)) {
                    score -= 320;
                  }
                  const prefMult = strategy === 'preferred' ? 2.0 : 0.85;
                  if (survA?.prefer?.includes(idD)) score += 45 * prefMult;
                  if (survD?.prefer?.includes(idA)) score += 45 * prefMult;
                }
              }
            }

            // Row average balance for 'balanced' strategy
            if (strategy === 'balanced' && rowCount > 0) {
              const rowAvg = rowGradeSum / rowCount;
              score -= Math.abs(rowAvg - 2.0) * 140;
            }
          }

          return score;
        }

        let current = flat.slice();
        let currentScore = evaluate(current);
        let best = current.slice();
        let bestScore = currentScore;

        const ITERATIONS = 5000;
        for (let step = 0; step < ITERATIONS; step++) {
          const temp = Math.max(0.5, 180 * Math.pow(1 - step / ITERATIONS, 2));
          const i1 = movableIndices[Math.floor(Math.random() * movableIndices.length)];
          let i2 = movableIndices[Math.floor(Math.random() * movableIndices.length)];
          if (i1 === i2) continue;

          // Swap
          const tmp = current[i1];
          current[i1] = current[i2];
          current[i2] = tmp;

          const nextScore = evaluate(current);
          const delta = nextScore - currentScore;

          if (delta > 0 || Math.exp(delta / temp) > Math.random()) {
            currentScore = nextScore;
            if (nextScore > bestScore) {
              bestScore = nextScore;
              best = current.slice();
            }
          } else {
            // Revert
            current[i2] = current[i1];
            current[i1] = tmp;
          }
        }

        // Write best back to 2D grid
        const nextGrid = Array.from({ length: rows }, () => Array(cols).fill(null));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            nextGrid[r][c] = best[r * cols + c] || null;
          }
        }

        const labelMap = {
          mentor: '멘토-멘티 짝꿍 매칭 (5,000회 최적화)',
          balanced: '성적 고른 분포 배치 (5,000회 최적화)',
          preferred: '선호 친구 우선 배치 (5,000회 최적화)'
        };

        ws.seating.grid = nextGrid;
        ws.seating.lastAlgorithm = labelMap[strategy] || 'AI 자동 배치';
        state.selectedSeat = null;
        persistCurrentWorkspace();
        render();
        showToast(`✨ ${labelMap[strategy]} 완료!`, 'success');
      }

      /* =========================================================================
       * 5. RELATIONSHIP GRAPH: 180-ITERATION FORCE LAYOUT, DIAGNOSTICS & PNG EXPORT
       * ========================================================================= */
      function computeForceGraphPositions(ws, forceReset = false) {
        const W = 1440;
        const H = 960;
        const PAD = 95;

        if (!state.graphPositions[ws.code]) {
          state.graphPositions[ws.code] = {};
        }
        const posMap = state.graphPositions[ws.code];
        const students = ws.students;
        if (students.length === 0) return posMap;

        const needsInit = forceReset || students.some((s) => !posMap[s.id]);
        if (needsInit) {
          const cx = W / 2;
          const cy = H / 2;
          const rx = W * 0.36;
          const ry = H * 0.35;
          students.forEach((st, idx) => {
            const angle = (2 * Math.PI * idx) / students.length - Math.PI / 2;
            posMap[st.id] = {
              x: cx + rx * Math.cos(angle) + ((idx % 3) - 1) * 18,
              y: cy + ry * Math.sin(angle) + ((idx % 2) - 0.5) * 18
            };
          });
        }

        // Build edges
        const prefEdges = [];
        const avoidEdges = [];
        students.forEach((st) => {
          const surv = ws.surveys[st.id];
          if (!surv) return;
          (surv.prefer || []).forEach((targetId, rank) => {
            if (targetId && getStudentById(ws, targetId)) {
              prefEdges.push({ source: st.id, target: targetId, weight: rank === 0 ? 1.5 : rank === 1 ? 1.1 : 0.8 });
            }
          });
          (surv.avoid || []).forEach((targetId) => {
            if (targetId && getStudentById(ws, targetId)) {
              avoidEdges.push({ source: st.id, target: targetId });
            }
          });
        });

        // 180-iteration Fruchterman-Reingold style layout with non-overlapping radius enforcement
        const ITER = 180;
        const idealDist = Math.sqrt((W * H) / Math.max(students.length, 4)) * 0.72;

        for (let iter = 0; iter < ITER; iter++) {
          const cooling = 1 - iter / (ITER + 15);
          const disp = {};
          students.forEach((s) => {
            disp[s.id] = { dx: 0, dy: 0 };
          });

          // Repulsion between all pairs
          for (let i = 0; i < students.length; i++) {
            for (let j = i + 1; j < students.length; j++) {
              const idA = students[i].id;
              const idB = students[j].id;
              let vx = posMap[idA].x - posMap[idB].x;
              let vy = posMap[idA].y - posMap[idB].y;
              let dist = Math.hypot(vx, vy) || 0.1;

              // Strong short-range repulsion so r=36 nodes never overlap
              const minSep = 118;
              let repForce = (idealDist * idealDist) / dist;
              if (dist < minSep) {
                repForce += (minSep - dist) * 18;
              }
              const fx = (vx / dist) * repForce * 0.045;
              const fy = (vy / dist) * repForce * 0.045;
              disp[idA].dx += fx;
              disp[idA].dy += fy;
              disp[idB].dx -= fx;
              disp[idB].dy -= fy;
            }
          }

          // Attraction along preferred edges
          prefEdges.forEach(({ source, target, weight }) => {
            if (!disp[source] || !disp[target]) return;
            const vx = posMap[target].x - posMap[source].x;
            const vy = posMap[target].y - posMap[source].y;
            const dist = Math.hypot(vx, vy) || 0.1;
            const targetLen = 195;
            const attForce = (dist - targetLen) * 0.032 * weight;
            const fx = (vx / dist) * attForce;
            const fy = (vy / dist) * attForce;
            disp[source].dx += fx;
            disp[source].dy += fy;
            disp[target].dx -= fx;
            disp[target].dy -= fy;
          });

          // Mild repulsion along avoid edges
          avoidEdges.forEach(({ source, target }) => {
            if (!disp[source] || !disp[target]) return;
            const vx = posMap[source].x - posMap[target].x;
            const vy = posMap[source].y - posMap[target].y;
            const dist = Math.hypot(vx, vy) || 0.1;
            if (dist < 420) {
              const push = (420 - dist) * 0.025;
              disp[source].dx += (vx / dist) * push;
              disp[source].dy += (vy / dist) * push;
              disp[target].dx -= (vx / dist) * push;
              disp[target].dy -= (vy / dist) * push;
            }
          });

          // Gentle gravity toward center & apply displacement
          students.forEach((s) => {
            const p = posMap[s.id];
            const d = disp[s.id];
            d.dx += (W / 2 - p.x) * 0.012;
            d.dy += (H / 2 - p.y) * 0.012;

            const mag = Math.hypot(d.dx, d.dy) || 1;
            const maxStep = 28 * cooling;
            const step = Math.min(mag, maxStep);
            p.x = Math.max(PAD, Math.min(W - PAD, p.x + (d.dx / mag) * step));
            p.y = Math.max(PAD, Math.min(H - PAD, p.y + (d.dy / mag) * step));
          });
        }

        return posMap;
      }

      function getSeatCoordinates(ws, studentId) {
        const { rows, cols, grid } = ws.seating;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r]?.[c] === studentId) {
              return { r, c };
            }
          }
        }
        return null;
      }

      function computeSeatSafetyDiagnostics(ws, studentId) {
        const target = getStudentById(ws, studentId);
        if (!target) return null;

        const posA = getSeatCoordinates(ws, studentId);
        const survA = ws.surveys[studentId] || { prefer: [], avoid: [] };

        const incomingPrefer = [];
        const avoidRelations = new Map(); // otherId -> { direction, rank }

        (survA.avoid || []).forEach((id, idx) => {
          if (id && getStudentById(ws, id)) {
            avoidRelations.set(id, { direction: '본인이 기피', rank: idx + 1 });
          }
        });

        ws.students.forEach((other) => {
          if (other.id === studentId) return;
          const survO = ws.surveys[other.id];
          if (!survO) return;
          if (survO.prefer?.includes(studentId)) {
            incomingPrefer.push({ student: other, rank: survO.prefer.indexOf(studentId) + 1 });
          }
          if (survO.avoid?.includes(studentId)) {
            if (avoidRelations.has(other.id)) {
              avoidRelations.get(other.id).direction = '쌍방 기피';
            } else {
              avoidRelations.set(other.id, { direction: '상대가 기피', rank: survO.avoid.indexOf(studentId) + 1 });
            }
          }
        });

        const avoidDiagnostics = [];
        avoidRelations.forEach((info, otherId) => {
          const otherSt = getStudentById(ws, otherId);
          if (!otherSt) return;
          const posB = getSeatCoordinates(ws, otherId);
          let distanceText = '미배치 상태';
          let euclidean = null;
          let isSafe = true;

          if (posA && posB) {
            const dr = Math.abs(posA.r - posB.r);
            const dc = Math.abs(posA.c - posB.c);
            euclidean = Math.hypot(dr, dc);
            // Adjacent (horizontal, vertical, or diagonal within 1.5 cells) is unsafe
            isSafe = euclidean >= 1.8;
            distanceText = `${euclidean.toFixed(1)}칸 떨어짐 (${posB.r + 1}행 ${posB.c + 1}열)`;
          }

          avoidDiagnostics.push({
            student: otherSt,
            direction: info.direction,
            rank: info.rank,
            euclidean,
            isSafe,
            distanceText
          });
        });

        return {
          student: target,
          seatPos: posA,
          outgoingPrefer: (survA.prefer || [])
            .map((id, idx) => ({ student: getStudentById(ws, id), rank: idx + 1 }))
            .filter((x) => x.student),
          incomingPrefer,
          avoidDiagnostics
        };
      }

      function exportRelationshipPng2880x1920(ws) {
        const svgEl = document.getElementById('relationship-svg-canvas');
        if (!svgEl) {
          showToast('관계도 캔버스를 찾을 수 없습니다.', 'error');
          return;
        }
        try {
          const clone = svgEl.cloneNode(true);
          clone.setAttribute('width', '2880');
          clone.setAttribute('height', '1920');
          const serializer = new XMLSerializer();
          const svgString = serializer.serializeToString(clone);
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 2880;
            canvas.height = 1920;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 2880, 1920);
            ctx.drawImage(img, 0, 0, 2880, 1920);
            URL.revokeObjectURL(url);

            canvas.toBlob((blob) => {
              if (!blob) {
                showToast('PNG 이미지 변환에 실패했습니다.', 'error');
                return;
              }
              const dlUrl = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = dlUrl;
              a.download = `${ws.name}_학급인물관계도_2880x1920.png`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(dlUrl);
              showToast('🖼️ 2880×1920 고해상도 PNG 이미지가 저장되었습니다!', 'success');
            }, 'image/png');
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            showToast('이미지 렌더링 중 오류가 발생했습니다.', 'error');
          };
          img.src = url;
        } catch (e) {
          showToast('PNG 내보내기 중 오류가 발생했습니다.', 'error');
        }
      }

      /* =========================================================================
       * 6. CSV EXPORT & AWARDS AGGREGATION
       * ========================================================================= */
      function exportSeatingCsv(ws) {
        const { cols, rows, grid } = ws.seating;
        const lines = [];
        lines.push([`${ws.name} (${ws.code}) 자리배치표`, `기준: ${ws.seating.lastAlgorithm}`].join(','));
        const header = ['행\\열'];
        for (let c = 0; c < cols; c++) {
          header.push(`${c + 1}열`);
        }
        lines.push(header.join(','));

        for (let r = 0; r < rows; r++) {
          const rowCells = [`${r + 1}행`];
          for (let c = 0; c < cols; c++) {
            const st = getStudentById(ws, grid[r]?.[c]);
            rowCells.push(st ? `"${st.num}번 ${st.name}"` : '""');
          }
          lines.push(rowCells.join(','));
        }

        const bom = '\uFEFF';
        const blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${ws.name}_자리배치표.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('📥 CSV 파일이 다운로드되었습니다.', 'success');
      }

      function computeAwardRankings(ws) {
        const tally = {};
        ws.students.forEach((s) => {
          tally[s.id] = {
            student: s,
            votes: 0,
            badges: [],
            messages: []
          };
        });

        Object.values(ws.surveys).forEach((surv) => {
          if (surv.bestStudentId && tally[surv.bestStudentId]) {
            tally[surv.bestStudentId].votes += 1;
            if (surv.bestBadge) {
              tally[surv.bestStudentId].badges.push(surv.bestBadge);
            }
            if (surv.message && surv.message.trim()) {
              tally[surv.bestStudentId].messages.push(surv.message.trim());
            }
          }
        });

        return Object.values(tally)
          .filter((item) => item.votes > 0)
          .sort((a, b) => b.votes - a.votes || a.student.num - b.student.num);
      }

                      })
                      .join('')}
                  </div>
                </div>

            <!-- Seating Placement Analysis Report (Hidden in TV Hide Mode or Print) -->
            ${

                ? `
              <div class="no-print bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80">
                <h3 class="text-sm sm:text-base font-extrabold text-slate-900 mb-4 flex items-center gap-2">
                  <span>📊 성적 · 멘토멘티 · 관계 배치 분석 리포트</span>
                </h3>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  <div class="p-4 rounded-2xl bg-emerald-50/70 border border-emerald-200">
                    <div class="text-xs font-bold text-emerald-700">선호 친구 인접 매칭</div>
                    <div class="mt-1 text-2xl font-extrabold text-emerald-950">${report.preferredMatches}쌍</div>
                    <div class="text-[11px] text-emerald-700 mt-0.5">1순위 희망 성사: ${report.firstChoiceMatches}건 (만족도 ${report.satisfactionRate}%)</div>
                  </div>
                  <div class="p-4 rounded-2xl ${
                    report.avoidConflicts > 0 ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200'
                  } border">
                    <div class="text-xs font-bold ${report.avoidConflicts > 0 ? 'text-rose-700' : 'text-slate-600'}">기피 친구 인접 충돌</div>
                    <div class="mt-1 text-2xl font-extrabold ${report.avoidConflicts > 0 ? 'text-rose-700' : 'text-slate-900'}">${report.avoidConflicts}건</div>
                    <div class="text-[11px] ${report.avoidConflicts > 0 ? 'text-rose-600 font-semibold' : 'text-slate-500'} mt-0.5">
                      ${report.avoidConflicts > 0 ? '⚠️ 경고 표시된 좌석을 교체해 주세요' : '✅ 기피 인접 충돌 0건 (안전)'}
                    </div>
                  </div>
                  <div class="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200">
                    <div class="text-xs font-bold text-indigo-700">멘토-멘티 짝꿍 매칭</div>
                    <div class="mt-1 text-2xl font-extrabold text-indigo-950">${report.mentorMenteeMatches}조</div>
                    <div class="text-[11px] text-indigo-700 mt-0.5">학습/생활 멘토링 인접 성사</div>
                  </div>
                  <div class="p-4 rounded-2xl bg-violet-50/70 border border-violet-200">
                    <div class="text-xs font-bold text-violet-700">분단·행 성적 균형 지수</div>
                    <div class="mt-1 text-2xl font-extrabold text-violet-950">${report.balanceScore}점</div>
                    <div class="text-[11px] text-violet-700 mt-0.5">상·중·하 성적 고른 분포도</div>
                  </div>
                </div>
              </div>
              `
                : ''
            }
          </div>
        `;
      }

      function renderSingleDeskCard(ws, r, c, studentId, pinnedMap, warningsMap, hideSens) {
        const st = getStudentById(ws, studentId);
        const isSelected =
          state.selectedSeat && state.selectedSeat.r === r && state.selectedSeat.c === c;
        const isPinned = st && Boolean(pinnedMap[st.id]);
        const warnList = st ? warningsMap[st.id] || [] : [];
        const hasWarning = !hideSens && warnList.length > 0;

        if (!st) {
          return `
            <div
              data-action="seating-click-cell"
              data-row="${r}"
              data-col="${c}"
              data-drop-row="${r}"
              data-drop-col="${c}"
              class="min-h-[76px] sm:min-h-[84px] rounded-2xl border-2 border-dashed transition flex flex-col items-center justify-center p-2 cursor-pointer ${
                isSelected
                  ? 'border-indigo-500 bg-indigo-50 text-indigo-700'
                  : 'border-slate-200 bg-slate-50/60 hover:bg-slate-100 text-slate-400'
              }"
            >
              <span class="text-[11px] font-semibold">빈 자리</span>
              <span class="text-[10px]">(${r + 1}-${c + 1})</span>
            </div>
          `;
        }

        const roleBadge =
          st.role === 'mentor'
            ? '<span class="px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 text-[10px] font-extrabold">멘토</span>'
            : st.role === 'mentee'
            ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-extrabold">멘티</span>'
            : '';

        const gradeBadgeColor =
          st.grade === '상'
            ? 'bg-emerald-100 text-emerald-800'
            : st.grade === '하'
            ? 'bg-rose-100 text-rose-800'
            : 'bg-slate-100 text-slate-700';

        return `
          <div
            draggable="true"
            data-action="seating-click-cell"
            data-row="${r}"
            data-col="${c}"
            data-drop-row="${r}"
            data-drop-col="${c}"
            title="${hasWarning ? esc(warnList.join(' / ')) : `${st.num}번 ${esc(st.name)}`}"
            class="relative min-h-[76px] sm:min-h-[84px] rounded-2xl border p-2.5 transition select-none flex flex-col justify-between cursor-pointer ${
              isSelected
                ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg ring-2 ring-indigo-300'
                : hasWarning
                ? 'bg-rose-50 text-slate-900 border-rose-400 avoid-warning-pulse'
                : isPinned && !hideSens
                ? 'bg-amber-50/80 text-slate-900 border-amber-400 shadow-sm'
                : 'bg-white hover:bg-indigo-50/40 text-slate-900 border-slate-200 shadow-xs'
            }"
          >
            <div class="flex items-center justify-between gap-1">
              <span class="text-[11px] font-bold ${isSelected ? 'text-indigo-200' : 'text-slate-400'}">${st.num}번</span>
              ${
                !hideSens
                  ? `
                <button
                  type="button"
                  data-action="seating-toggle-pin"
                  data-student-id="${esc(st.id)}"
                  title="앞자리/위치 고정 토글"
                  class="no-print px-1.5 py-0.5 rounded-lg text-xs transition cursor-pointer ${
                    isPinned
                      ? 'bg-amber-400 text-slate-950 font-bold shadow-xs'
                      : isSelected
                      ? 'bg-white/20 text-white hover:bg-white/30'
                      : 'bg-slate-100 text-slate-400 hover:text-slate-700'
                  }"
                >
                  📌
                </button>
                `
                  : ''
              }
            </div>

            <div class="text-center font-extrabold text-sm sm:text-base tracking-tight my-0.5 truncate">
              ${esc(st.name)}
            </div>

            ${
              !hideSens
                ? `
              <div class="no-print flex items-center justify-center gap-1 flex-wrap">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${
                  isSelected ? 'bg-white/20 text-white' : gradeBadgeColor
                }">${esc(st.grade)}</span>
                ${roleBadge}
                ${
                  hasWarning
                    ? '<span class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-extrabold">⚠️ 기피</span>'
                    : ''
                }
              </div>
              `
                : '<div class="h-2"></div>'
            }
          </div>
        `;
      }

      function renderRelationshipGraphTab(ws) {
        const posMap = computeForceGraphPositions(ws, false);
        const students = ws.students;
        const selectedId = state.selectedGraphStudentId;
        const diagnostic = selectedId ? computeSeatSafetyDiagnostics(ws, selectedId) : null;

        // Build visual edges
        const edgeElements = [];
        const processedMutual = new Set();

        students.forEach((stA) => {
          const survA = ws.surveys[stA.id];
          if (!survA) return;
          const pA = posMap[stA.id];
          if (!pA) return;

          // Preferred edges
          if (state.graphFilter !== 'avoid') {
            (survA.prefer || []).forEach((idB, rankIdx) => {
              if (!idB || !posMap[idB]) return;
              const survB = ws.surveys[idB];
              const isMutual = Boolean(survB?.prefer?.includes(stA.id));

              if (state.graphFilter === 'mutual' && !isMutual) return;

              const pB = posMap[idB];
              const isDimmed = selectedId && selectedId !== stA.id && selectedId !== idB;

              if (isMutual) {
                const pairKey = [stA.id, idB].sort().join('-');
                if (processedMutual.has(pairKey)) return;
                processedMutual.add(pairKey);

                edgeElements.push(`
                  <g opacity="${isDimmed ? '0.18' : '0.92'}">
                    <line
                      x1="${pA.x}" y1="${pA.y}" x2="${pB.x}" y2="${pB.y}"
                      stroke="#10b981" stroke-width="5" stroke-linecap="round"
                    />
                    <circle cx="${(pA.x + pB.x) / 2}" cy="${(pA.y + pB.y) / 2}" r="13" fill="#10b981" />
                    <text
                      x="${(pA.x + pB.x) / 2}" y="${(pA.y + pB.y) / 2 + 4}"
                      text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold"
                    >♥</text>
                  </g>
                `);
              } else {
                // Curved directed arrow for one-way preference
                const mx = (pA.x + pB.x) / 2 - (pB.y - pA.y) * 0.12;
                const my = (pA.y + pB.y) / 2 + (pB.x - pA.x) * 0.12;
                edgeElements.push(`
                  <g opacity="${isDimmed ? '0.14' : '0.78'}">
                    <path
                      d="M ${pA.x} ${pA.y} Q ${mx} ${my} ${pB.x} ${pB.y}"
                      fill="none" stroke="#6366f1" stroke-width="${rankIdx === 0 ? 3.2 : 2.2}"
                      marker-end="url(#arrow-prefer)"
                    />
                  </g>
                `);
              }
            });
          }

          // Avoidance edges
          if (state.graphFilter === 'all' || state.graphFilter === 'avoid') {
            (survA.avoid || []).forEach((idB) => {
              if (!idB || !posMap[idB]) return;
              const pB = posMap[idB];
              const isDimmed = selectedId && selectedId !== stA.id && selectedId !== idB;
              const mx = (pA.x + pB.x) / 2 + (pB.y - pA.y) * 0.14;
              const my = (pA.y + pB.y) / 2 - (pB.x - pA.x) * 0.14;
              edgeElements.push(`
                <g opacity="${isDimmed ? '0.14' : '0.85'}">
                  <path
                    d="M ${pA.x} ${pA.y} Q ${mx} ${my} ${pB.x} ${pB.y}"
                    fill="none" stroke="#f43f5e" stroke-width="2.6" stroke-dasharray="8 6"
                    marker-end="url(#arrow-avoid)"
                  />
                </g>
              `);
            });
          }
        });

        // Build r=36 large nodes
        const nodeElements = students
          .map((st) => {
            const p = posMap[st.id];
            if (!p) return '';
            const isSelected = selectedId === st.id;
            const fill = isSelected
              ? '#4f46e5'
              : st.role === 'mentor'
              ? '#eef2ff'
              : st.role === 'mentee'
              ? '#fffbeb'
              : '#ffffff';
            const stroke = isSelected
              ? '#312e81'
              : st.role === 'mentor'
              ? '#6366f1'
              : st.role === 'mentee'
              ? '#f59e0b'
              : '#64748b';
            const textFill = isSelected ? '#ffffff' : '#0f172a';
            const subFill = isSelected ? '#c7d2fe' : '#64748b';

            return `
              <g
                data-action="graph-select-node"
                data-student-id="${esc(st.id)}"
                style="cursor: pointer;"
              >
                <circle
                  cx="${p.x}" cy="${p.y}" r="36"
                  fill="${fill}" stroke="${stroke}" stroke-width="${isSelected ? 5 : 3.5}"
                />
                <text
                  x="${p.x}" y="${p.y - 6}"
                  text-anchor="middle" fill="${subFill}" font-size="13" font-weight="700"
                >${st.num}번</text>
                <text
                  x="${p.x}" y="${p.y + 14}"
                  text-anchor="middle" fill="${textFill}" font-size="16" font-weight="800"
                >${esc(st.name)}</text>
              </g>
            `;
          })
          .join('');

        const wrapperClass = state.graphFullscreen
          ? 'fixed inset-0 z-50 bg-slate-50 p-4 sm:p-6 flex flex-col overflow-auto'
          : 'space-y-5 animate-fade-in';

        return `
          <div class="${wrapperClass}">
            <!-- Graph Control Bar -->
            <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-900">🕸️ 고가독성 학급 인물관계도 (1440×960 · 대형 노드 r=36)</h2>
                <p class="text-xs text-slate-500">학생 노드를 클릭하면 <strong>좌석 안전 분리 거리 진단 카드</strong>가 열립니다.</p>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <!-- Filter -->
                <div class="inline-flex rounded-xl bg-slate-100 p-1 text-xs font-bold">
                  <button
                    type="button"
                    data-action="graph-set-filter"
                    data-filter="all"
                    class="px-3 py-1.5 rounded-lg cursor-pointer ${state.graphFilter === 'all' ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'}"
                  >전체 관계</button>
                  <button
                    type="button"
                    data-action="graph-set-filter"
                    data-filter="mutual"
                    class="px-3 py-1.5 rounded-lg cursor-pointer ${state.graphFilter === 'mutual' ? 'bg-white text-emerald-700 shadow-xs' : 'text-slate-600'}"
                  >♥ 상호 선호</button>
                  <button
                    type="button"
                    data-action="graph-set-filter"
                    data-filter="avoid"
                    class="px-3 py-1.5 rounded-lg cursor-pointer ${state.graphFilter === 'avoid' ? 'bg-white text-rose-700 shadow-xs' : 'text-slate-600'}"
                  >⚠️ 기피 관계</button>
                </div>

                <!-- 180-Iter Auto Arrange -->
                <button
                  type="button"
                  data-action="graph-rearrange"
                  class="px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold cursor-pointer"
                >
                  ✨ 180회 자동 정돈
                </button>

                <!-- 80% ~ 150% Zoom -->
                <div class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold">
                  <button type="button" data-action="graph-zoom-delta" data-delta="-10" class="px-1.5 hover:text-indigo-600 cursor-pointer">－</button>
                  <span class="w-10 text-center">${state.graphZoom}%</span>
                  <button type="button" data-action="graph-zoom-delta" data-delta="10" class="px-1.5 hover:text-indigo-600 cursor-pointer">＋</button>
                </div>

                <!-- Fullscreen Toggle -->
                <button
                  type="button"
                  data-action="graph-toggle-fullscreen"
                  class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold cursor-pointer"
                >
                  ${state.graphFullscreen ? '↙️ 전체화면 종료' : '⛶ 전체화면'}
                </button>

                <!-- 2880x1920 PNG Export -->
                <button
                  type="button"
                  data-action="graph-export-png"
                  class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold shadow-sm cursor-pointer"
                >
                  🖼️ 2880×1920 PNG 한 장 저장
                </button>
              </div>
            </div>

            <!-- SVG Canvas + Diagnostic Side Panel -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1">
              <div class="${diagnostic ? 'lg:col-span-8' : 'lg:col-span-12'} bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-auto p-3">
                <div style="width: ${state.graphZoom}%; min-width: 100%; transition: width 0.2s;">
                  <svg
                    id="relationship-svg-canvas"
                    viewBox="0 0 1440 960"
                    xmlns="http://www.w3.org/2000/svg"
                    class="w-full h-auto rounded-2xl bg-slate-50/70 border border-slate-100"
                  >
                    <defs>
                      <marker id="arrow-prefer" viewBox="0 0 10 10" refX="34" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#6366f1" />
                      </marker>
                      <marker id="arrow-avoid" viewBox="0 0 10 10" refX="34" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f43f5e" />
                      </marker>
                    </defs>

                    <!-- Header inside SVG so PNG export includes title & legend -->
                    <text x="36" y="44" fill="#0f172a" font-size="24" font-weight="800">${esc(ws.name)} 학급 인물관계도</text>
                    <text x="36" y="70" fill="#64748b" font-size="14" font-weight="600">
                      초록 굵은선(♥): 상호 선호 · 파랑 실선: 단방향 선호 · 빨강 점선: 기피 관계
                    </text>

                    ${edgeElements.join('')}
                    ${nodeElements}
                  </svg>
                </div>
              </div>

              <!-- Seat Safety Separation Diagnostic Card (Shown when a node is clicked) -->
              ${
                diagnostic
                  ? `
                <div class="lg:col-span-4 bg-white rounded-3xl p-5 shadow-md border border-indigo-200 flex flex-col justify-between animate-fade-in">
                  <div>
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                      <div>
                        <span class="text-[11px] font-extrabold text-indigo-600 uppercase">좌석 안전 분리 거리 진단 카드</span>
                        <h3 class="text-lg font-extrabold text-slate-900">
                          ${diagnostic.student.num}번 ${esc(diagnostic.student.name)}
                        </h3>
                      </div>
                      <button
                        type="button"
                        data-action="graph-close-diagnostic"
                        class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs cursor-pointer"
                      >✕</button>
                    </div>

                    <div class="mt-3 p-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs">
                      <span class="text-slate-500 font-semibold">현재 좌석 위치:</span>
                      <strong class="text-slate-900 ml-1">
                        ${diagnostic.seatPos ? `${diagnostic.seatPos.r + 1}행 ${diagnostic.seatPos.c + 1}열` : '미배치 대기석'}
                      </strong>
                    </div>

                    <!-- Avoidance Separation Check -->
                    <div class="mt-4">
                      <h4 class="text-xs font-extrabold text-rose-700 mb-2">🛡️ 기피 관계 좌석 분리 안전 진단</h4>
                      ${
                        diagnostic.avoidDiagnostics.length === 0
                          ? '<p class="text-xs text-slate-500 bg-slate-50 p-3 rounded-xl">등록된 기피 관계가 없습니다.</p>'
                          : `<div class="space-y-2">
                              ${diagnostic.avoidDiagnostics
                                .map(
                                  (item) => `
                                <div class="p-3 rounded-2xl border ${
                                  item.isSafe ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50 border-rose-300'
                                }">
                                  <div class="flex items-center justify-between text-xs font-bold">
                                    <span>${item.student.num}번 ${esc(item.student.name)} (${esc(item.direction)})</span>
                                    <span class="px-2 py-0.5 rounded-full text-[11px] ${
                                      item.isSafe ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
                                    }">
                                      ${item.isSafe ? '✅ 안전 분리' : '🚨 위험 인접'}
                                    </span>
                                  </div>
                                  <div class="text-[11px] text-slate-600 mt-1">거리: ${esc(item.distanceText)}</div>
                                </div>
                              `
                                )
                                .join('')}
                            </div>`
                      }
                    </div>

                    <!-- Preferred Friends Summary -->
                    <div class="mt-4 grid grid-cols-2 gap-2.5 text-xs">
                      <div class="p-3 rounded-2xl bg-indigo-50/70 border border-indigo-100">
                        <div class="font-bold text-indigo-800 mb-1">👉 희망한 친구</div>
                        ${
                          diagnostic.outgoingPrefer.length === 0
                            ? '<div class="text-slate-400">없음</div>'
                            : diagnostic.outgoingPrefer
                                .map((p) => `<div>${p.rank}순위: ${p.student.num}번 ${esc(p.student.name)}</div>`)
                                .join('')
                        }
                      </div>
                      <div class="p-3 rounded-2xl bg-emerald-50/70 border border-emerald-100">
                        <div class="font-bold text-emerald-800 mb-1">👈 나를 희망한 친구</div>
                        ${
                          diagnostic.incomingPrefer.length === 0
                            ? '<div class="text-slate-400">없음</div>'
                            : diagnostic.incomingPrefer
                                .map((p) => `<div>${p.student.num}번 ${esc(p.student.name)} (${p.rank}순위)</div>`)
                                .join('')
                        }
                      </div>
                    </div>
                  </div>

                  <button
                    type="button"

            if (target) {
              allMessages.push({
                toName: `${target.num}번 ${target.name}`,

                  ? Array.from({ length: 18 })
                      .map((_, i) => {

                        const color = colors[i % colors.length];
                        const left = (i * 5.5) % 96;
                        const delay = (i % 5) * 0.25;

        `;

      /**
       * 7-E. MAIN TEACHER DASHBOARD SHELL
       */
      function renderTeacherDashboard(ws) {
        const tabs = [
          { id: 'seating', label: '🪑 자리배치 스튜디오' },
          { id: 'graph', label: '🕸️ 학급 인물관계도' },
          { id: 'survey', label: `📋 설문 & 명단 (${Object.keys(ws.surveys).length}/${ws.students.length})` },

        ];

        return `
          <div class="min-h-screen bg-slate-100/80 flex flex-col">
            <!-- Top Navigation Header (Hidden on Print) -->

              <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-base shadow-sm">
                    M

                    <div class="flex items-center gap-2">
                      <span class="font-extrabold text-sm sm:text-base text-slate-900">모두의자리</span>
                      <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-mono text-xs font-extrabold border border-indigo-200">

                  </div>
                </div>

                <!-- Right Teacher Action Buttons -->
                <div class="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    data-action="open-firebase-modal"
                    class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold cursor-pointer"

                    ${state.firebaseConfig.enabled ? '☁️ 클라우드 연동됨' : '💾 로컬 자동저장'}
                  </button>
                  <button
                    type="button"
                    data-action="copy-student-link"
                    class="px-3 py-2 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-200 text-xs font-bold cursor-pointer"
                  >
                    🔗 학생 배포 링크 복사
                  </button>
                  <button
                    type="button"
                    data-action="enter-preview-mode"
                    class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-orange-500 to-rose-500 hover:from-orange-600 hover:to-rose-600 text-white text-xs font-extrabold shadow-xs cursor-pointer"
                  >
                    📌 패들렛 학생 화면 미리보기
                  </button>
                  <button
                    type="button"
                    data-action="teacher-logout"
                    class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold cursor-pointer"
                  >
                    🚪 학급 잠금
                  </button>
                </div>
              </div>

              <!-- Sub-Navigation Tabs -->
              <div class="max-w-7xl mx-auto px-4 pb-2.5 flex items-center gap-1.5 overflow-x-auto">
                ${tabs
                  .map(
                    (t) => `
                  <button

                        ? 'bg-indigo-600 text-white shadow-sm'

              ${state.activeTab === 'seating' ? renderSeatingStudioTab(ws) : ''}
              ${state.activeTab === 'graph' ? renderRelationshipGraphTab(ws) : ''}
              ${state.activeTab === 'survey' ? renderSurveyAndRosterTab(ws) : ''}
              ${state.activeTab === 'awards' ? renderAwardsCeremonyTab(ws) : ''}
