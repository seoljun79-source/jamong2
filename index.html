    #sociogram-svg text {

    }

    /* 책상 카드 인터랙션 */
    .desk-card {

    }
    .desk-card:hover {

    }

      background-color: #eef2ff !important;

      background-color: #e0e7ff !important;
    }

    @keyframes conflictPulse {

      50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }
    .desk-conflict {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      animation: conflictPulse 1.8s infinite;
    }

    @keyframes confettiFall {

    }
    .confetti-piece {
      position: fixed;
      top: 0;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      z-index: 90;
      pointer-events: none;
      animation: confettiFall 3.2s linear forwards;

      const memoryStorage = {};

      function safeStorageGet(key) {
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            return window.localStorage.getItem(key);
          }
        } catch (e) {
          // iframe 샌드박스 제한 시 인메모리 폴백 사용
        }
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null;
      }

      function safeStorageSet(key, value) {
        memoryStorage[key] = value;
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(key, value);
          }
        } catch (e) {
          // 제한 환경에서도 예외 없이 계속 진행
        }
      }

      function safeReadUrlParams() {
        try {
          const params = new URLSearchParams(window.location.search || '');
          return {
            mode: params.get('mode') || '',
            code: params.get('code') || ''
          };
        } catch (e) {
          return { mode: '', code: '' };
        }
      }

      function safeUpdateUrlParams(mode, code) {
        try {
          if (typeof window !== 'undefined' && window.history && window.history.replaceState) {
            const url = new URL(window.location.href);
            if (mode) {
              url.searchParams.set('mode', mode);
            } else {
              url.searchParams.delete('mode');
            }
            if (code) {
              url.searchParams.set('code', code);
            }
            window.history.replaceState({}, '', url.toString());
          }
        } catch (e) {
          // 샌드박스 iframe history 제한 무시
        }
      }

      function copyTextToClipboard(text) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, 99999);
          document.execCommand('copy');
          document.body.removeChild(textarea);
          return true;
        } catch (e) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {}
          return false;
        }
      }

      function toggleNativeFullscreenSafe(enable) {
        try {
          if (enable && document.documentElement && document.documentElement.requestFullscreen && !document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else if (!enable && document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }
        } catch (e) {
          // 샌드박스 제한 시 CSS 전체화면 오버레이로 정상 동작
        }
      }

      function escHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateTime(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return String(isoStr);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        const styles = {
          success: 'bg-slate-900 text-white border-emerald-400',
          warning: 'bg-red-600 text-white border-red-200',
          peach:   'bg-[#C93B27] text-white border-amber-200',
          info:    'bg-slate-800 text-white border-indigo-400'
        };
        el.className = `pointer-events-auto border-l-4 ${styles[type] || styles.info} px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 opacity-0 translate-y-2`;
        el.textContent = message;
        container.appendChild(el);
        requestAnimationFrame(() => el.classList.remove('opacity-0', 'translate-y-2'));
        setTimeout(() => {
          el.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => el.remove(), 300);
        }, 3400);
      }

          layout: 'cluster',        // 'cluster' | 'circle'
          zoom: 1,                  // 0.8 ~ 1.5
          fullscreen: false,
          focusedId: null,
          draggingId: null,
          justDragged: false,
          positions: {}
        },

        // 교실 TV 시상식 오버레이
        awardsTv: {
          open: false,
          revealStep: 0
        },

        // 모달 및 PIN 잠금 해제
        modals: {
          padletGuide: false,
          unlockPrompt: false,
          unlockInput: ''
        }
      };

      /* =====================================================================
         4. 영구 저장소 & 워크스페이스 관리
         ===================================================================== */
      function getStudent(id) {
        return state.students.find((s) => Number(s.id) === Number(id)) || null;
      }

      function getSurvey(studentId) {
        return state.surveysMap[Number(studentId)] || null;
      }

      function getWorkspaceKey(code = state.classCode) {
        return `modus_seat_v5_${code}`;
      }

      function saveWorkspace() {
        const payload = {
          pin: state.teacherPin,
          deskMode: state.deskMode,
          cols: state.cols,
          rows: state.rows,
          strategy: state.strategy,
          students: state.students,
          surveys: state.surveysMap,
          seats: state.seats,
          archives: state.archives,
          sociogramPositions: state.sociogram.positions,
          updatedAt: new Date().toISOString()
        };
        safeStorageSet(getWorkspaceKey(state.classCode), JSON.stringify(payload));
      }

      function applySeedData() {
        state.students = JSON.parse(JSON.stringify(SEED_STUDENTS));
        state.surveysMap = JSON.parse(JSON.stringify(SEED_SURVEYS));
        state.archives = [];
        state.sociogram.positions = {};
        const pending = state.students.find((s) => !state.surveysMap[s.id]);
        state.survey.selectedId = pending ? pending.id : (state.students[0]?.id || 1);
      }

      function loadWorkspace(rawCode, seedIfMissing = true) {
        const code = String(rawCode || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '') || 'MODU2026';
        state.classCode = code;
        state.classCodeDraft = code;
        state.survey.codeInput = code;
        state.selectedSeatIdx = null;
        state.sociogram.focusedId = null;

        const rawJson = safeStorageGet(getWorkspaceKey(code)) || safeStorageGet(`modus_seat_v4_${code}`);
        if (rawJson) {
          try {
            const data = JSON.parse(rawJson);
            if (data && Array.isArray(data.students)) {
              state.teacherPin = data.pin || '1234';
              state.deskMode = data.deskMode || 'single';
              state.cols = Number(data.cols) || (state.deskMode === 'single' ? 5 : 6);
              state.rows = Number(data.rows) || 6;
              state.strategy = data.strategy || 'mentor';
              state.students = data.students.sort((a, b) => a.id - b.id);
              state.surveysMap = data.surveys && typeof data.surveys === 'object' ? data.surveys : {};
              state.archives = Array.isArray(data.archives) ? data.archives : [];
              state.sociogram.positions = data.sociogramPositions && typeof data.sociogramPositions === 'object' ? data.sociogramPositions : {};

              ensureSeatCapacity(false);
              if (Array.isArray(data.seats) && data.seats.length === state.cols * state.rows) {
                state.seats = data.seats;
              } else {
                optimizeSeating(false, false);
              }
              const pending = state.students.find((s) => !getSurvey(s.id));
              state.survey.selectedId = pending ? pending.id : (state.students[0]?.id || 1);
              return;
            }
          } catch (e) {}
        }

        if (seedIfMissing || code === 'MODU2026') {
          applySeedData();
          state.deskMode = 'single';
          state.cols = 5;
          state.rows = 6;
          optimizeSeating(false, true);
        } else {
          state.students = [];
          state.surveysMap = {};
          state.seats = new Array(state.cols * state.rows).fill(null);
          state.archives = [];
          state.sociogram.positions = {};
          saveWorkspace();
        }
      }

      /* =====================================================================
         5. 멘토-멘티 성적 매칭 + 5,000회 시뮬레이티드 어닐링 알고리즘
         ===================================================================== */
      function getPreferIds(sv) {
        if (!sv) return [];
        const list = Array.isArray(sv.prefer) && sv.prefer.length > 0
          ? sv.prefer
          : [sv.prefer1, sv.prefer2, sv.prefer3];
        return list.map(Number).filter((v) => !isNaN(v) && v > 0);
      }

      function getAvoidIds(sv) {
        if (!sv) return [];
        const list = Array.isArray(sv.avoid) && sv.avoid.length > 0
          ? sv.avoid
          : [sv.avoid1, sv.avoid2, sv.avoid3];
        return list.map(Number).filter((v) => !isNaN(v) && v > 0);
      }

      function hasAvoidRelation(idA, idB) {
        if (!idA || !idB) return false;
        const svA = getSurvey(idA);
        const svB = getSurvey(idB);
        const aAvoidsB = getAvoidIds(svA).includes(Number(idB));
        const bAvoidsA = getAvoidIds(svB).includes(Number(idA));
        return Boolean(aAvoidsB || bAvoidsA);
      }

      function hasPreferRelation(idA, idB) {
        if (!idA || !idB) return false;
        const svA = getSurvey(idA);
        const svB = getSurvey(idB);
        const aPrefB = getPreferIds(svA).includes(Number(idB));
        const bPrefA = getPreferIds(svB).includes(Number(idA));
        return Boolean(aPrefB || bPrefA);
      }

      function isSameDeskPair(colA, colB) {
        return Math.floor(colA / 2) === Math.floor(colB / 2);
      }

      function ensureSeatCapacity(notify = true) {
        const studentCount = state.students.length;
        if (studentCount === 0) return false;

        if (state.cols * state.rows < studentCount) {
          let neededRows = Math.ceil(studentCount / state.cols);
          if (neededRows > 8) {
            state.cols = state.deskMode === 'pair' ? 8 : 7;
            neededRows = Math.min(8, Math.ceil(studentCount / state.cols));
          }
          state.rows = neededRows;
          if (notify) {
            showToast(`⚠️ 학생 수(${studentCount}명)보다 총 좌석이 적어 세로 행을 ${state.rows}행(${state.cols * state.rows}석)으로 자동 보정했습니다.`, 'info');
          }
          return true;
        }
        return false;
      }

      function getGradeTierContext() {
        const sorted = [...state.students].sort((a, b) => (b.score - a.score) || (a.id - b.id));
        const n = sorted.length;
        const half = Math.ceil(n / 2);
        const tierMap = {};
        sorted.forEach((st, idx) => {
          tierMap[st.id] = idx < half ? 'mentor' : 'mentee';
        });
        const classMean = n > 0 ? sorted.reduce((acc, s) => acc + s.score, 0) / n : 0;
        return { sorted, tierMap, classMean };
      }

      function buildInitialSeats(totalSeats, tierCtx) {
        const { cols, rows, strategy } = state;
        const studentCount = state.students.length;
        const initial = new Array(totalSeats).fill(null);
        if (studentCount === 0) return initial;

        const pinned = state.students.filter((s) => s.pinned).sort((a, b) => b.score - a.score);
        const unpinned = state.students.filter((s) => !s.pinned).sort((a, b) => (b.score - a.score) || (a.id - b.id));

        const frontSlots = Array.from({ length: Math.min(cols, studentCount) }, (_, i) => i).sort(() => Math.random() - 0.5);
        const usedIds = new Set();

        pinned.forEach((st, idx) => {
          if (idx < frontSlots.length) {
            initial[frontSlots[idx]] = st.id;
            usedIds.add(st.id);
          }
        });

        if (strategy === 'mentor') {
          const half = Math.ceil(unpinned.length / 2);
          const mentors = unpinned.slice(0, half);
          const mentees = unpinned.slice(half);
          const availableMentees = [...mentees];
          const pairedQueue = [];

          mentors.forEach((mentor, idx) => {
            if (availableMentees.length === 0) {
              pairedQueue.push(mentor.id);
              return;
            }
            let bestIdx = 0;
            let bestFit = -Infinity;
            availableMentees.forEach((mentee, mIdx) => {
              const gap = mentor.score - mentee.score;
              const pairAvg = (mentor.score + mentee.score) / 2;
              const gapBonus = (gap >= 15 && gap <= 42) ? 110 : -Math.abs(gap - 26);
              const avgPenalty = Math.abs(pairAvg - tierCtx.classMean) * 2.5;
              const jitter = (Math.random() - 0.5) * 18;
              const fit = gapBonus - avgPenalty + jitter;
              if (fit > bestFit) {
                bestFit = fit;
                bestIdx = mIdx;
              }
            });
            const matchedMentee = availableMentees.splice(bestIdx, 1)[0];
            if ((idx + Math.floor(Math.random() * 2)) % 2 === 0) {
              pairedQueue.push(mentor.id, matchedMentee.id);
            } else {
              pairedQueue.push(matchedMentee.id, mentor.id);
            }
          });
          availableMentees.forEach((m) => pairedQueue.push(m.id));

          const remaining = pairedQueue.filter((id) => !usedIds.has(id));
          let ptr = 0;
          for (let slot = 0; slot < studentCount; slot++) {
            if (initial[slot] === null && ptr < remaining.length) {
              initial[slot] = remaining[ptr++];
            }
          }
          return initial;
        }

        // [성적 고른 분포 균형] 또는 [선호 친구 우선 반영] 초기 배치 (빈자리는 뒷행 우선 유지)
        const pool = unpinned.map((s) => s.id).filter((id) => !usedIds.has(id));
        if (strategy === 'prefer') {
          pool.sort(() => Math.random() - 0.5);
        } else {
          for (let i = 0; i + 1 < pool.length; i += 2) {
            if (Math.random() < 0.35) {
              [pool[i], pool[i + 1]] = [pool[i + 1], pool[i]];
            }
          }
        }

        let ptr = 0;
        for (let r = 0; r < rows; r++) {
          const colSeq = r % 2 === 0
            ? Array.from({ length: cols }, (_, c) => c)
            : Array.from({ length: cols }, (_, c) => cols - 1 - c);
          for (const c of colSeq) {
            const slot = r * cols + c;
            if (slot < studentCount && initial[slot] === null && ptr < pool.length) {
              initial[slot] = pool[ptr++];
            }
          }
        }
        for (let s = 0; s < studentCount; s++) {
          if (initial[s] === null && ptr < pool.length) {
            initial[s] = pool[ptr++];
          }
        }
        return initial;
      }

      function evaluateSeatsEnergy(seatArr, tierCtx) {
        const { cols, rows, deskMode, strategy } = state;
        const { tierMap, classMean } = tierCtx;
        const total = seatArr.length;
        let score = 0;

        const prefWeights = strategy === 'prefer' ? [680, 400, 220] : [320, 190, 105];
        const frontBackPrefWeights = strategy === 'prefer' ? [280, 160, 90] : [140, 80, 45];

        for (let idx = 0; idx < total; idx++) {
          const stA = getStudent(seatArr[idx]);
          if (!stA) continue;
          const svA = getSurvey(stA.id);
          const prefsA = getPreferIds(svA);
          const r = Math.floor(idx / cols);
          const c = idx % cols;

          // 1) 앞자리 고정석(📌) 1행 유지 제약
          if (stA.pinned && r > 0) {
            score -= r * 45000;
          }

          // 2) 오른쪽 인접 좌석 검사 (짝꿍 & 가로 옆자리)
          if (c + 1 < cols) {
            const stB = getStudent(seatArr[idx + 1]);
            if (stB) {
              const svB = getSurvey(stB.id);
              const prefsB = getPreferIds(svB);
              const isPairMate = deskMode === 'pair' && isSameDeskPair(c, c + 1);
              const sideMultiplier = isPairMate ? 1 : 0.75;

              if (hasAvoidRelation(stA.id, stB.id)) {
                score -= 60000;
              }

              prefsA.forEach((pid, rankIdx) => {
                if (pid === Number(stB.id) && prefWeights[rankIdx]) {
                  score += Math.round(prefWeights[rankIdx] * sideMultiplier);
                }
              });
              prefsB.forEach((pid, rankIdx) => {
                if (pid === Number(stA.id) && prefWeights[rankIdx]) {
                  score += Math.round(prefWeights[rankIdx] * sideMultiplier);
                }
              });

              if (strategy === 'mentor' && deskMode === 'single') {
                const gap = Math.abs(stA.score - stB.score);
                score += tierMap[stA.id] !== tierMap[stB.id] ? 640 : -360;
                if (gap >= 15 && gap <= 42) score += 380;
              }
            }
          }

          // 3) 바로 앞·뒤 좌석 검사
          if (r + 1 < rows) {
            const stDown = getStudent(seatArr[(r + 1) * cols + c]);
            if (stDown) {
              const svDown = getSurvey(stDown.id);
              const prefsDown = getPreferIds(svDown);
              if (hasAvoidRelation(stA.id, stDown.id)) {
                score -= 60000;
              }
              prefsA.forEach((pid, rankIdx) => {
                if (pid === Number(stDown.id) && frontBackPrefWeights[rankIdx]) {
                  score += frontBackPrefWeights[rankIdx];
                }
              });
              prefsDown.forEach((pid, rankIdx) => {
                if (pid === Number(stA.id) && frontBackPrefWeights[rankIdx]) {
                  score += frontBackPrefWeights[rankIdx];
                }
              });

              if (strategy === 'mentor' && deskMode === 'single') {
                const gap = Math.abs(stA.score - stDown.score);
                if (tierMap[stA.id] !== tierMap[stDown.id]) score += 300;
                if (gap >= 15 && gap <= 42) score += 180;
              }
            }
          }

          // 4) 대각선 인접 좌석 기피 금지 (-60,000점)
          if (r + 1 < rows && c - 1 >= 0) {
            const stDiagLeft = getStudent(seatArr[(r + 1) * cols + (c - 1)]);
            if (stDiagLeft && hasAvoidRelation(stA.id, stDiagLeft.id)) {
              score -= 60000;
            }
          }
          if (r + 1 < rows && c + 1 < cols) {
            const stDiagRight = getStudent(seatArr[(r + 1) * cols + (c + 1)]);
            if (stDiagRight && hasAvoidRelation(stA.id, stDiagRight.id)) {
              score -= 60000;
            }
          }

          // 5) 3명 이상 친한 무리 연속 밀집 감점
          if (c + 2 < cols) {
            const stB = getStudent(seatArr[idx + 1]);
            const stC = getStudent(seatArr[idx + 2]);
            if (stB && stC && hasPreferRelation(stA.id, stB.id) && hasPreferRelation(stB.id, stC.id)) {
              score -= 250;
            }
          }
          if (r + 2 < rows) {
            const stD1 = getStudent(seatArr[(r + 1) * cols + c]);
            const stD2 = getStudent(seatArr[(r + 2) * cols + c]);
            if (stD1 && stD2 && hasPreferRelation(stA.id, stD1.id) && hasPreferRelation(stD1.id, stD2.id)) {
              score -= 220;
            }
          }
        }

        // 6) 2인 1조 짝꿍형 멘토-멘티 매칭 정밀 평가
        if (deskMode === 'pair' && strategy === 'mentor') {
          const pairCount = Math.floor(cols / 2);
          for (let r = 0; r < rows; r++) {
            for (let p = 0; p < pairCount; p++) {
              const idx1 = r * cols + p * 2;
              const idx2 = idx1 + 1;
              const stA = getStudent(seatArr[idx1]);
              const stB = getStudent(seatArr[idx2]);

              if (stA && stB) {
                const gap = Math.abs(stA.score - stB.score);
                const pairAvg = (stA.score + stB.score) / 2;

                score += tierMap[stA.id] !== tierMap[stB.id] ? 1500 : -1000;
                if (gap >= 15 && gap <= 42) {
                  score += 680;
                } else if (gap >= 10 && gap < 15) {
                  score += 240;
                } else {
                  score -= 350;
                }
                score -= Math.abs(pairAvg - classMean) * 35;
              }
            }
          }
        }

        // 7) 분단(줄)별 성적 평균 편차 최소화
        const groupMeans = [];
        if (deskMode === 'pair') {
          const bundanCount = Math.floor(cols / 2);
          for (let b = 0; b < bundanCount; b++) {
            let sum = 0;
            let cnt = 0;
            for (let r = 0; r < rows; r++) {
              for (let off = 0; off < 2; off++) {
                const st = getStudent(seatArr[r * cols + b * 2 + off]);
                if (st) { sum += st.score; cnt += 1; }
              }
            }
            if (cnt > 0) groupMeans.push(sum / cnt);
          }
        } else {
          for (let c = 0; c < cols; c++) {
            let sum = 0;
            let cnt = 0;
            for (let r = 0; r < rows; r++) {
              const st = getStudent(seatArr[r * cols + c]);
              if (st) { sum += st.score; cnt += 1; }
            }
            if (cnt > 0) groupMeans.push(sum / cnt);
          }
        }

        if (groupMeans.length > 1) {
          const maxDiff = Math.max(...groupMeans.map((m) => Math.abs(m - classMean)));
          const devWeight = strategy === 'balance' ? 160 : (strategy === 'mentor' ? 100 : 45);
          score -= maxDiff * devWeight;
        }

        return score;
      }

      function optimizeSeating(notify = false, shouldSave = true) {
        const autoAdjusted = ensureSeatCapacity(notify);
        const totalSeats = state.cols * state.rows;
        const studentCount = Math.min(state.students.length, totalSeats);
        const tierCtx = getGradeTierContext();

        const current = buildInitialSeats(totalSeats, tierCtx);
        let currentScore = evaluateSeatsEnergy(current, tierCtx);
        let best = [...current];
        let bestScore = currentScore;

        const iterations = 5000;
        if (studentCount >= 2) {
          for (let step = 0; step < iterations; step++) {
            const temperature = Math.max(1, 500 * Math.pow(1 - step / iterations, 1.3));
            const i = Math.floor(Math.random() * studentCount);
            const j = Math.floor(Math.random() * studentCount);
            if (i === j) continue;

            [current[i], current[j]] = [current[j], current[i]];
            const candidateScore = evaluateSeatsEnergy(current, tierCtx);
            const delta = candidateScore - currentScore;

            if (delta >= 0 || Math.random() < Math.exp(delta / temperature)) {
              currentScore = candidateScore;
              if (currentScore > bestScore) {
                bestScore = currentScore;
                best = [...current];
              }
            } else {
              [current[i], current[j]] = [current[j], current[i]];
            }
          }
        }

        state.seats = best;
        state.selectedSeatIdx = null;
        if (shouldSave) saveWorkspace();

        if (notify && !autoAdjusted) {
          const labelMap = {
            mentor: '멘토-멘티 짝꿍 매칭',
            balance: '성적 고른 분포 균형',
            prefer: '선호 친구 우선 반영'
          };
          showToast(`✨ [${labelMap[state.strategy]}] ${state.cols}열 × ${state.rows}행(${totalSeats}석) 5,000회 최적 배치를 완료했습니다!`, 'success');
        }
      }

      function analyzeCurrentSeating() {
        const { cols, rows, seats, deskMode } = state;
        const total = cols * rows;
        const { tierMap, classMean } = getGradeTierContext();
        const conflictIndices = new Set();
        let conflictPairs = 0;

        for (let idx = 0; idx < total; idx++) {
          const stA = getStudent(seats[idx]);
          if (!stA) continue;
          const r = Math.floor(idx / cols);
          const c = idx % cols;

          // 오른쪽 인접
          if (c + 1 < cols) {
            const stB = getStudent(seats[idx + 1]);
            if (stB && hasAvoidRelation(stA.id, stB.id)) {
              conflictIndices.add(idx);
              conflictIndices.add(idx + 1);
              conflictPairs += 1;
            }
          }
          // 아래쪽 인접
          if (r + 1 < rows) {
            const stDown = getStudent(seats[(r + 1) * cols + c]);
            if (stDown && hasAvoidRelation(stA.id, stDown.id)) {
              conflictIndices.add(idx);
              conflictIndices.add((r + 1) * cols + c);
              conflictPairs += 1;
            }
          }
          // 대각선 인접
          if (r + 1 < rows && c - 1 >= 0) {
            const stDL = getStudent(seats[(r + 1) * cols + (c - 1)]);
            if (stDL && hasAvoidRelation(stA.id, stDL.id)) {
              conflictIndices.add(idx);
              conflictIndices.add((r + 1) * cols + (c - 1));
              conflictPairs += 1;
            }
          }
          if (r + 1 < rows && c + 1 < cols) {
            const stDR = getStudent(seats[(r + 1) * cols + (c + 1)]);
            if (stDR && hasAvoidRelation(stA.id, stDR.id)) {
              conflictIndices.add(idx);
              conflictIndices.add((r + 1) * cols + (c + 1));
              conflictPairs += 1;
            }
          }
        }

        // 분단(줄)별 실제 평균 점수 계산
        const groupAverages = [];
        if (deskMode === 'pair') {
          const bundanCount = Math.floor(cols / 2);
          for (let b = 0; b < bundanCount; b++) {
            let sum = 0;
            let cnt = 0;
            for (let r = 0; r < rows; r++) {
              for (let off = 0; off < 2; off++) {
                const st = getStudent(seats[r * cols + b * 2 + off]);
                if (st) { sum += st.score; cnt += 1; }
              }
            }
            groupAverages.push({ label: `${b + 1}분단`, avg: cnt > 0 ? sum / cnt : 0, count: cnt });
          }
        } else {
          for (let c = 0; c < cols; c++) {
            let sum = 0;
            let cnt = 0;
            for (let r = 0; r < rows; r++) {
              const st = getStudent(seats[r * cols + c]);
              if (st) { sum += st.score; cnt += 1; }
            }
            groupAverages.push({ label: `${c + 1}열(${c + 1}분단)`, avg: cnt > 0 ? sum / cnt : 0, count: cnt });
          }
        }

        const activeGroups = groupAverages.filter((g) => g.count > 0);
        const scoreDeviation = activeGroups.length > 1
          ? Math.max(...activeGroups.map((g) => Math.abs(g.avg - classMean)))
          : 0;

        // 멘토-멘티 매칭 성공 쌍 수 & 짝꿍 평균 점수차 계산
        const seatRoleMeta = {};
        let totalPairs = 0;
        let matchedPairs = 0;
        let gapSum = 0;

        if (deskMode === 'pair') {
          const pairCount = Math.floor(cols / 2);
          for (let r = 0; r < rows; r++) {
            for (let p = 0; p < pairCount; p++) {
              const idx1 = r * cols + p * 2;
              const idx2 = idx1 + 1;
              const st1 = getStudent(seats[idx1]);
              const st2 = getStudent(seats[idx2]);

              if (st1 && st2) {
                totalPairs += 1;
                const gap = Math.abs(st1.score - st2.score);
                const pairAvg = (st1.score + st2.score) / 2;
                gapSum += gap;

                const isMentorPair = tierMap[st1.id] !== tierMap[st2.id] || gap >= 15;
                if (isMentorPair) matchedPairs += 1;

                const st1Higher = st1.score > st2.score || (st1.score === st2.score && tierMap[st1.id] === 'mentor');
                seatRoleMeta[idx1] = {
                  role: st1Higher ? 'mentor' : 'mentee',
                  partnerName: st2.name,
                  gap,
                  pairAvg,
                  isMentorPair
                };
                seatRoleMeta[idx2] = {
                  role: st1Higher ? 'mentee' : 'mentor',
                  partnerName: st1.name,
                  gap,
                  pairAvg,
                  isMentorPair
                };
              } else if (st1) {
                seatRoleMeta[idx1] = { role: tierMap[st1.id], partnerName: null, gap: 0, pairAvg: st1.score, isMentorPair: false };
              } else if (st2) {
                seatRoleMeta[idx2] = { role: tierMap[st2.id], partnerName: null, gap: 0, pairAvg: st2.score, isMentorPair: false };
              }
            }
          }
        } else {
          for (let idx = 0; idx < total; idx++) {
            const st = getStudent(seats[idx]);
            if (st) seatRoleMeta[idx] = { role: tierMap[st.id], partnerName: null, gap: 0, pairAvg: st.score, isMentorPair: false };
          }
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c + 1 < cols; c++) {
              const st1 = getStudent(seats[r * cols + c]);
              const st2 = getStudent(seats[r * cols + c + 1]);
              if (st1 && st2) {
                totalPairs += 1;
                const gap = Math.abs(st1.score - st2.score);
                gapSum += gap;
                if (tierMap[st1.id] !== tierMap[st2.id] || gap >= 15) matchedPairs += 1;
              }
            }
          }
        }

        const avgPairGap = totalPairs > 0 ? gapSum / totalPairs : 0;

        // 선호 친구 반영률 (1~3순위 중 1명 이상 인접 배정 비율)
        let applicants = 0;
        let satisfied = 0;
        for (let idx = 0; idx < total; idx++) {
          const st = getStudent(seats[idx]);
          if (!st) continue;
          const sv = getSurvey(st.id);
          const prefIds = getPreferIds(sv);
          if (prefIds.length === 0) continue;
          applicants += 1;
          const r = Math.floor(idx / cols);
          const c = idx % cols;
          const neighbors = [];
          if (c > 0) neighbors.push(Number(seats[idx - 1]));
          if (c + 1 < cols) neighbors.push(Number(seats[idx + 1]));
          if (r > 0) neighbors.push(Number(seats[(r - 1) * cols + c]));
          if (r + 1 < rows) neighbors.push(Number(seats[(r + 1) * cols + c]));

          if (prefIds.some((pid) => neighbors.includes(pid))) {
            satisfied += 1;
          }
        }
        const preferRate = applicants > 0 ? Math.round((satisfied / applicants) * 100) : 100;

        return {
          conflictIndices,
          conflictPairs,
          classMean,
          scoreDeviation,
          preferRate,
          groupAverages,
          seatRoleMeta,
          matchedPairs,
          totalPairs,
          avgPairGap
        };
      }

      /* =====================================================================
         6. 자리배치표 그림(PNG) Canvas 렌더링 & CSV / JSON 내보내기
         ===================================================================== */
      function drawRoundedRectPath(ctx, x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

            ctx.fill();
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = 1;

          // 좌측 행 번호 라벨

          ctx.strokeStyle = origRow === 0 ? '#FCD34D' : '#CBD5E1';

          ctx.stroke();

          ctx.fillStyle = origRow === 0 ? '#92400E' : '#334155';
          ctx.font = '800 13px "Noto Sans KR", Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${origRow + 1}행`, gridStartX + (rowLabelW - 8) / 2, y + cellH / 2 + 4);

              const bw = getColX(p * 2 + 1) + cellW - getColX(p * 2) + 8;
              drawRoundedRectPath(ctx, bx, y - 4, bw, cellH + 8, 12);
              ctx.fillStyle = '#F1F5F9';
              ctx.fill();
              ctx.strokeStyle = '#CBD5E1';
              ctx.lineWidth = 1;
              ctx.stroke();
            }

          colOrder.forEach((origCol, vc) => {
            const x = getColX(vc);
            const seatIdx = origRow * cols + origCol;
            const st = getStudent(seats[seatIdx]);
            const isConflict = analysis.conflictIndices.has(seatIdx);
            const roleMeta = analysis.seatRoleMeta[seatIdx];

            drawRoundedRectPath(ctx, x, y, cellW, cellH, 10);
            if (!st) {
              ctx.fillStyle = '#F8FAFC';
              ctx.fill();
              ctx.save();
              ctx.setLineDash([5, 4]);

              ctx.lineWidth = 1.5;
              ctx.stroke();
              ctx.restore();

            ctx.strokeStyle = isConflict ? '#EF4444' : '#94A3B8';
            ctx.lineWidth = isConflict ? 2.5 : 1.5;
            ctx.stroke();

            // 좌석번호 + 성별 + 핀

            ctx.fillStyle = '#64748B';
            ctx.font = '700 11px "Noto Sans KR", Inter, sans-serif';
            ctx.fillText(`${seatIdx + 1}석 (${origRow + 1}-${origCol + 1})`, x + 10, y + 20);

            ctx.textAlign = 'right';
            ctx.fillStyle = st.gender === 'M' ? '#4338CA' : '#BE123C';
            ctx.font = '800 11px "Noto Sans KR", Inter, sans-serif';
            const pinMark = (!tvHideSensitive && st.pinned) ? '📌 ' : '';

            // 중앙 학생 학번·이름

            ctx.font = '800 17px "Noto Sans KR", Inter, sans-serif';

            // 하단 멘토/멘티 및 점수 배지

        // 하단 출력 시각

        link.href = canvas.toDataURL('image/png');

      /* =====================================================================
         7. 고가독성 학급 인물관계도 레이아웃 & SVG 생성
         ===================================================================== */
      function computeSociogramPositions() {
        const WIDTH = 1440;
        const HEIGHT = 960;
        const cx = WIDTH / 2;
        const cy = HEIGHT / 2 + 25;
        const n = state.students.length;
        if (n === 0) return;

        if (state.sociogram.layout === 'circle') {
          state.students.forEach((st, i) => {
            const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
            state.sociogram.positions[st.id] = {
              x: cx + Math.cos(angle) * 555,
              y: cy + Math.sin(angle) * 355
            };
          });
          return;
        }

        // 무리 중심 자동 배치 (180회 반발·인력 시뮬레이션, 최소 172px 간격 확보)
        state.students.forEach((st, i) => {
          const angle = (i / n) * Math.PI * 2;
          const ring = i % 2 === 0 ? 1 : 0.68;
          state.sociogram.positions[st.id] = {
            x: cx + Math.cos(angle) * 440 * ring,
            y: cy + Math.sin(angle) * 290 * ring
          };
        });

        const MIN_DIST = 172;
        for (let iter = 0; iter < 180; iter++) {
          for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
              const pA = state.sociogram.positions[state.students[i].id];
              const pB = state.sociogram.positions[state.students[j].id];
              const dx = pB.x - pA.x;
              const dy = pB.y - pA.y;
              const dist = Math.hypot(dx, dy) || 0.1;
              if (dist < MIN_DIST) {
                const push = (MIN_DIST - dist) * 0.28;
                const ux = dx / dist;
                const uy = dy / dist;
                pA.x -= ux * push;
                pA.y -= uy * push;
                pB.x += ux * push;
                pB.y += uy * push;
              }
            }
          }

          state.students.forEach((st) => {
            const pA = state.sociogram.positions[st.id];
            const sv = getSurvey(st.id);
            if (sv) {
              [...getPreferIds(sv), sv.bestStudentId].forEach((tid) => {
                if (!tid || !state.sociogram.positions[tid]) return;
                const pB = state.sociogram.positions[tid];
                const dx = pB.x - pA.x;
                const dy = pB.y - pA.y;
                const dist = Math.hypot(dx, dy) || 1;
                if (dist > 195) {
                  const pull = Math.min(8, (dist - 195) * 0.028);
                  pA.x += (dx / dist) * pull;
                  pA.y += (dy / dist) * pull;
                  pB.x -= (dx / dist) * pull;
                  pB.y -= (dy / dist) * pull;
                }
              });

              getAvoidIds(sv).forEach((tid) => {
                if (!tid || !state.sociogram.positions[tid]) return;
                const pB = state.sociogram.positions[tid];
                const dx = pB.x - pA.x;
                const dy = pB.y - pA.y;
                const dist = Math.hypot(dx, dy) || 1;
                if (dist < 430) {
                  const repel = (430 - dist) * 0.032;
                  pA.x -= (dx / dist) * repel;
                  pA.y -= (dy / dist) * repel;
                  pB.x += (dx / dist) * repel;
                  pB.y += (dy / dist) * repel;
                }
              });
            }

            pA.x = Math.max(95, Math.min(WIDTH - 95, pA.x + (cx - pA.x) * 0.015));
            pA.y = Math.max(135, Math.min(HEIGHT - 65, pA.y + (cy - pA.y) * 0.015));
          });
        }
      }

      function getAwardLeaderboard() {
        const tally = {};
        state.students.forEach((s) => {
          tally[s.id] = { student: s, votes: 0, badges: {}, notes: [] };
        });
        Object.values(state.surveysMap).forEach((sv) => {
          if (sv && sv.bestStudentId && tally[sv.bestStudentId]) {
            const entry = tally[sv.bestStudentId];
            entry.votes += 1;
            const b = sv.bestBadge || PRAISE_BADGES[0];
            entry.badges[b] = (entry.badges[b] || 0) + 1;
            if (sv.bestMessage) {
              entry.notes.push({ target: entry.student, badge: b, note: sv.bestMessage });
            }
          }
        });
        return Object.values(tally).sort((a, b) => b.votes - a.votes);
      }

      function launchCelebrationConfetti() {
        const colors = ['#FF7A64', '#FBBF24', '#34D399', '#60A5FA', '#F472B6'];
        for (let i = 0; i < 48; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.backgroundColor = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * 0.7}s`;
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 3800);
        }
      }

      /* =====================================================================
         9. 고가독성 학급 인물관계도 (1440x960 대형 SVG + 상세 진단 카드)
         ===================================================================== */
      function buildSociogramSvgMarkup() {
        if (Object.keys(state.sociogram.positions).length !== state.students.length) {
          computeSociogramPositions();
        }

        const NODE_R = 36;
        const prefSet = new Set();
        const praiseCounts = {};
        const avoidInvolvedSet = new Set();
        state.students.forEach((s) => { praiseCounts[s.id] = 0; });

        state.students.forEach((s) => {
          const sv = getSurvey(s.id);
          if (!sv) return;
          getPreferIds(sv).forEach((tid) => {
            prefSet.add(`${s.id}->${tid}`);
          });
          getAvoidIds(sv).forEach((tid) => {
            avoidInvolvedSet.add(s.id);
            avoidInvolvedSet.add(Number(tid));
          });
          if (sv.bestStudentId && praiseCounts[sv.bestStudentId] !== undefined) {
            praiseCounts[sv.bestStudentId] += 1;
          }
        });

        const edges = [];
        const drawnMutual = new Set();

        state.students.forEach((s) => {
          const sv = getSurvey(s.id);
          if (!sv) return;

          getPreferIds(sv).forEach((tid) => {
            if (!tid) return;
            const isMutual = prefSet.has(`${tid}->${s.id}`);
            if (isMutual) {
              const pairKey = [Math.min(s.id, tid), Math.max(s.id, tid)].join('-');
              if (!drawnMutual.has(pairKey)) {
                drawnMutual.add(pairKey);
                edges.push({ from: s.id, to: Number(tid), type: 'mutual' });
              }
            } else {
              edges.push({ from: s.id, to: Number(tid), type: 'oneway' });
            }
          });

          getAvoidIds(sv).forEach((tid) => {
            if (!tid) return;
            edges.push({ from: s.id, to: Number(tid), type: 'avoid' });
          });

          if (sv.bestStudentId) {
            edges.push({ from: s.id, to: Number(sv.bestStudentId), type: 'praise' });
          }
        });

        // 현재 배정된 (행-열) 좌석 라벨 매핑
        const seatLabelMap = {};
        state.seats.forEach((stId, idx) => {
          if (stId) {
            const r = Math.floor(idx / state.cols) + 1;
            const c = (idx % state.cols) + 1;
            seatLabelMap[stId] = `${r}-${c}·`;
          }
        });

        const { filter, focusedId, positions } = state.sociogram;
        const connectedSet = new Set();
        if (focusedId) connectedSet.add(focusedId);

        const pairEdgeCounter = {};
        let edgesSvg = '';
        let avoidMidMarkersSvg = '';

        edges.forEach((e) => {
          if (filter === 'prefer' && e.type !== 'mutual' && e.type !== 'oneway') return;
          if (filter === 'avoid' && e.type !== 'avoid') return;
          if (filter === 'praise' && e.type !== 'praise') return;

          const p1 = positions[e.from];
          const p2 = positions[e.to];
          if (!p1 || !p2) return;

          const isHighlighted = !focusedId || e.from === focusedId || e.to === focusedId;
          if (isHighlighted && focusedId) {
            connectedSet.add(e.from);
            connectedSet.add(e.to);
          }

          const pairKey = `${Math.min(e.from, e.to)}_${Math.max(e.from, e.to)}`;
          const stackIdx = pairEdgeCounter[pairKey] || 0;
          pairEdgeCounter[pairKey] = stackIdx + 1;

          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy) || 1;
          const nx = -dy / dist;
          const ny = dx / dist;

          const baseCurve = e.type === 'avoid' ? -0.16 : (e.type === 'praise' ? 0.22 : 0.13);
          const curveSign = stackIdx % 2 === 0 ? 1 : -1;
          const curveFactor = baseCurve * curveSign + stackIdx * 0.05;

          const cxCtrl = (p1.x + p2.x) / 2 + nx * dist * curveFactor;
          const cyCtrl = (p1.y + p2.y) / 2 + ny * dist * curveFactor;

          const t1x = cxCtrl - p1.x;
          const t1y = cyCtrl - p1.y;
          const t1Len = Math.hypot(t1x, t1y) || 1;
          const startX = p1.x + (t1x / t1Len) * (NODE_R + 4);
          const startY = p1.y + (t1y / t1Len) * (NODE_R + 4);

          const t2x = p2.x - cxCtrl;
          const t2y = p2.y - cyCtrl;
          const t2Len = Math.hypot(t2x, t2y) || 1;
          const endX = p2.x - (t2x / t2Len) * (NODE_R + 5);
          const endY = p2.y - (t2y / t2Len) * (NODE_R + 5);

          const midX = 0.25 * startX + 0.5 * cxCtrl + 0.25 * endX;
          const midY = 0.25 * startY + 0.5 * cyCtrl + 0.25 * endY;

          let stroke = '#10B981';
          let dash = '';
          let strokeWidth = '3.6';
          let markerAttrs = 'marker-start="url(#arrow-mutual-start)" marker-end="url(#arrow-mutual-end)"';

          if (e.type === 'oneway') {
            stroke = '#16A34A';
            dash = '7,5';
            strokeWidth = '2.6';
            markerAttrs = 'marker-end="url(#arrow-oneway)"';
          } else if (e.type === 'avoid') {
            stroke = '#EF4444';
            dash = '8,5';
            strokeWidth = '3.4';
            markerAttrs = '';
          } else if (e.type === 'praise') {
            stroke = '#F97316';
            dash = '4,3';
            strokeWidth = '2.6';
            markerAttrs = 'marker-end="url(#arrow-praise)"';
          }

          const opacity = isHighlighted ? '0.92' : '0.12';
          edgesSvg += `<path d="M ${startX.toFixed(1)} ${startY.toFixed(1)} Q ${cxCtrl.toFixed(1)} ${cyCtrl.toFixed(1)} ${endX.toFixed(1)} ${endY.toFixed(1)}" fill="none" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${opacity}" ${markerAttrs} />`;

          if (e.type === 'avoid') {
            avoidMidMarkersSvg += `
              <g transform="translate(${midX.toFixed(1)}, ${midY.toFixed(1)})" opacity="${isHighlighted ? '1' : '0.15'}">
                <circle r="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
                <text y="4" text-anchor="middle" font-size="12">⚠️</text>
              </g>
            `;
          }
        });

        let nodesSvg = '';
        state.students.forEach((st) => {
          const pos = positions[st.id];
          if (!pos) return;
          const isFocused = focusedId === st.id;
          const dimmed = focusedId && !connectedSet.has(st.id);
          const fill = st.gender === 'M' ? '#EEF2FF' : '#FFF1F2';
          const stroke = isFocused ? '#312E81' : (st.gender === 'M' ? '#4F46E5' : '#E11D48');
          const hasCrown = (praiseCounts[st.id] || 0) >= 2;
          const hasAvoidWarn = avoidInvolvedSet.has(st.id);
          const seatText = seatLabelMap[st.id] || '';

          nodesSvg += `
            <g transform="translate(${pos.x.toFixed(1)}, ${pos.y.toFixed(1)})" opacity="${dimmed ? '0.18' : '1'}"
              data-soc-node-id="${st.id}" style="cursor: pointer;">
              ${isFocused ? `<circle r="${NODE_R + 7}" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="5,3" />` : ''}
              <circle r="${NODE_R}" fill="${fill}" stroke="${stroke}" stroke-width="${isFocused ? '4' : '2.8'}" filter="url(#nodeShadow)" />
              <text y="-4" text-anchor="middle" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" fill="#0F172A">
                ${escHtml(st.name)}
              </text>
              <rect x="-32" y="5" width="64" height="17" rx="8.5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
              <text y="17" text-anchor="middle" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="11" font-weight="800" fill="#475569">
                ${st.id}번·${seatText}${st.score}
              </text>
              ${hasCrown ? `
                <g transform="translate(26, -26)">
                  <circle r="13" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
                  <text y="4.5" text-anchor="middle" font-size="13">👑</text>
                </g>
              ` : ''}
              ${hasAvoidWarn ? `
                <g transform="translate(-26, -26)">
                  <circle r="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" />
                  <text y="4" text-anchor="middle" font-size="11">⚠️</text>
                </g>
              ` : ''}
            </g>
          `;
        });

        const zoomPct = Math.round((state.sociogram.zoom || 1) * 100);
        const scaledWidth = Math.round(1440 * (state.sociogram.zoom || 1));

        return `
          <div class="overflow-auto bg-slate-50 rounded-2xl border border-slate-200 p-3">
            <div style="width: ${scaledWidth}px; min-width: 100%; margin: 0 auto; transition: width 0.15s ease;">
              <svg id="sociogram-svg" viewBox="0 0 1440 960" class="w-full h-auto block rounded-xl bg-white shadow-2xs" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.12" />
                  </filter>
                  <marker id="arrow-mutual-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981" />
                  </marker>
                  <marker id="arrow-mutual-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
                    <path d="M 10 1.5 L 1 5 L 10 8.5 z" fill="#10B981" />
                  </marker>
                  <marker id="arrow-oneway" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#16A34A" />
                  </marker>
                  <marker id="arrow-praise" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
                    <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#F97316" />
                  </marker>
                </defs>

                <rect width="1440" height="960" rx="18" fill="#FFFFFF" />
                <rect x="0" y="0" width="1440" height="86" rx="18" fill="#F8FAFC" />
                <line x1="0" y1="86" x2="1440" y2="86" stroke="#E2E8F0" stroke-width="1.5" />

                <text x="32" y="38" font-family="Inter, 'Noto Sans KR', sans-serif" font-size="22" font-weight="800" fill="#0F172A">
                  🍑 모두의자리 · 학급 인물관계도 (${escHtml(state.classCode)} · 좌석 ${state.cols}×${state.rows} · 배율 ${zoomPct}%)
                </text>

                <!-- 상단 범례 -->
                <g transform="translate(32, 62)">
                  <line x1="0" y1="0" x2="30" y2="0" stroke="#10B981" stroke-width="3.8" />
                  <text x="38" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#1E293B">💚 상호 선호(양방향)</text>

                  <line x1="190" y1="0" x2="220" y2="0" stroke="#16A34A" stroke-width="2.8" stroke-dasharray="6,4" />
                  <text x="228" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#1E293B">🌱 단방향 선호</text>

                  <line x1="345" y1="0" x2="375" y2="0" stroke="#EF4444" stroke-width="3.5" stroke-dasharray="7,4" />
                  <text x="383" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#DC2626">🚨 기피·갈등</text>

                  <line x1="490" y1="0" x2="520" y2="0" stroke="#F97316" stroke-width="2.8" stroke-dasharray="4,3" />
                  <text x="528" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#EA580C">🍑 칭찬 추천</text>

                  <circle cx="645" cy="0" r="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" />
                  <text x="660" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#334155">남학생</text>

                  <circle cx="730" cy="0" r="8" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.5" />
                  <text x="745" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#334155">여학생</text>

                  <text x="815" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#B45309">👑 다수 칭찬 학생</text>
                  <text x="965" y="5" font-family="sans-serif" font-size="14" font-weight="800" fill="#B91C1C">⚠️ 갈등 주의</text>
                </g>

                ${edgesSvg}
                ${avoidMidMarkersSvg}
                ${nodesSvg}
              </svg>
            </div>
          </div>
        `;
      }

      function renderFocusedStudentDiagnosisCard() {
        const target = getStudent(state.sociogram.focusedId);
        if (!target) {
          return `
            <div class="bg-indigo-50/70 border border-indigo-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm text-indigo-900">
              <div>
                💡 <strong>학생 상세 관계 &amp; 좌석 안전 진단:</strong> 위 인물관계도에서 <strong>학생 원(Node)을 클릭</strong>하면 해당 학생의 선호·기피 관계(1~3순위), 현재 좌석의 안전 분리 거리, 받은 칭찬 메시지가 아래에 크게 펼쳐집니다. (원을 드래그하여 자유롭게 배치 조정도 가능합니다.)
              </div>
            </div>
          `;
        }

        const sv = getSurvey(target.id);
        const seatIdx = state.seats.findIndex((id) => Number(id) === Number(target.id));
        const seatRow = seatIdx >= 0 ? Math.floor(seatIdx / state.cols) + 1 : null;
        const seatCol = seatIdx >= 0 ? (seatIdx % state.cols) + 1 : null;

        const myPreferIds = getPreferIds(sv);
        const incomingPreferStudents = state.students.filter((s) => {
          if (s.id === target.id) return false;
          const otherSv = getSurvey(s.id);
          return getPreferIds(otherSv).includes(target.id);
        });

        const myAvoidIds = getAvoidIds(sv);
        const avoidRelatedMap = new Map();
        myAvoidIds.forEach((id, idx) => {
          avoidRelatedMap.set(Number(id), { myRank: idx + 1, incomingRank: null });
        });
        state.students.forEach((s) => {
          if (s.id === target.id) return;
          const otherSv = getSurvey(s.id);
          const otherAvoids = getAvoidIds(otherSv);
          const foundIdx = otherAvoids.indexOf(target.id);
          if (foundIdx >= 0) {
            const prev = avoidRelatedMap.get(s.id) || { myRank: null, incomingRank: null };
            prev.incomingRank = foundIdx + 1;
            avoidRelatedMap.set(s.id, prev);
          }
        });

        const avoidDiagnostics = Array.from(avoidRelatedMap.entries()).map(([otherId, rankInfo]) => {
          const otherSt = getStudent(otherId);
          const otherIdx = state.seats.findIndex((id) => Number(id) === otherId);
          let isAdjacent = false;
          let distText = '좌석 미배정';

          if (seatIdx >= 0 && otherIdx >= 0) {
            const r1 = Math.floor(seatIdx / state.cols);
            const c1 = seatIdx % state.cols;
            const r2 = Math.floor(otherIdx / state.cols);
            const c2 = otherIdx % state.cols;
            const dr = Math.abs(r1 - r2);
            const dc = Math.abs(c1 - c2);
            const manhattan = dr + dc;
            isAdjacent = dr <= 1 && dc <= 1;
            distText = isAdjacent
              ? `⚠️ 인접 배치됨 (${otherIdx + 1}번석 · ${r2 + 1}행 ${c2 + 1}열)`
              : `✅ 안전 분리됨 (${otherIdx + 1}번석 · ${r2 + 1}행 ${c2 + 1}열 · ${manhattan}칸 거리)`;
          }
          const rankLabels = [];
          if (rankInfo.myRank) rankLabels.push(`본인 선택 ${rankInfo.myRank}순위`);
          if (rankInfo.incomingRank) rankLabels.push(`상대 선택 ${rankInfo.incomingRank}순위`);
          return { otherSt, isAdjacent, distText, rankTag: rankLabels.join(' · ') };
        });

        const receivedPraises = [];
        state.students.forEach((s) => {
          const otherSv = getSurvey(s.id);
          if (otherSv && Number(otherSv.bestStudentId) === target.id) {
            receivedPraises.push({
              badge: otherSv.bestBadge || PRAISE_BADGES[0],
              message: otherSv.bestMessage || '한 줄 칭찬 메시지 없이 추천해 주었어요!'
            });
          }
        });

        return `
          <div class="bg-white border-2 border-indigo-400 rounded-2xl p-5 shadow-md space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3.5">
              <div class="flex flex-wrap items-center gap-2.5">
                <span class="px-3 py-1 rounded-xl ${target.gender === 'M' ? 'bg-indigo-600' : 'bg-rose-600'} text-white text-sm font-extrabold">
                  ${target.id}번 ${escHtml(target.name)} (${target.gender === 'M' ? '남' : '여'})
                </span>
                <span class="px-3 py-1 rounded-xl bg-slate-100 text-slate-800 text-xs sm:text-sm font-extrabold">
                  성적 ${target.score}점
                </span>
                <span class="px-3 py-1 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs sm:text-sm font-extrabold">
                  ${seatIdx >= 0 ? `현재 좌석: ${seatIdx + 1}번석 (${seatRow}행 ${seatCol}열)` : '현재 좌석 미배정'}
                </span>
              </div>
              <button type="button" data-action="clear-soc-focus"
                class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold">
                ✕ 선택 해제 (전체 보기)
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
              <div class="bg-emerald-50/60 border border-emerald-200 rounded-2xl p-4 space-y-2.5">
                <div class="text-sm font-extrabold text-emerald-800">💚 선호 친구 관계 분석 (최대 3순위)</div>
                <div class="space-y-1.5 text-xs sm:text-sm">
                  <div class="font-bold text-slate-700">• 내가 선택한 친구:</div>
                  ${myPreferIds.length === 0 ? '<div class="text-slate-400 pl-2">선택한 친구 없음 (상관없음)</div>' : myPreferIds.map((pid, i) => {
                    const pSt = getStudent(pid);
                    const pSv = getSurvey(pid);
                    const isMutual = getPreferIds(pSv).includes(target.id);
                    return `<div class="pl-2 font-extrabold text-slate-900">
                      (${i + 1}순위) ${pSt ? `${pSt.id}번 ${escHtml(pSt.name)}` : '-'}
                      <span class="ml-1 px-2 py-0.5 rounded-full text-[11px] ${isMutual ? 'bg-emerald-600 text-white' : 'bg-white text-emerald-700 border border-emerald-300'}">
                        ${isMutual ? '💚 상호 선호' : '🌱 단방향'}
                      </span>
                    </div>`;
                  }).join('')}

                  <div class="font-bold text-slate-700 pt-2">• 나를 함께 앉고 싶어한 친구:</div>
                  ${incomingPreferStudents.length === 0
                    ? '<div class="text-slate-400 pl-2">없음</div>'
                    : `<div class="pl-2 flex flex-wrap gap-1.5">${incomingPreferStudents.map((st) => `<span class="px-2.5 py-1 rounded-lg bg-white border border-emerald-200 text-xs font-extrabold text-emerald-800">${st.id}번 ${escHtml(st.name)}</span>`).join('')}</div>`
                  }
                </div>
              </div>

              <div class="bg-rose-50/60 border border-rose-200 rounded-2xl p-4 space-y-2.5">
                <div class="text-sm font-extrabold text-rose-800">🚨 기피 관계 (최대 3순위) &amp; 좌석 안전 진단</div>
                ${avoidDiagnostics.length === 0 ? `
                  <div class="bg-white rounded-xl p-3.5 border border-emerald-200 text-xs sm:text-sm font-extrabold text-emerald-700">
                    ✅ 기피·갈등 관계가 없는 학생입니다.
                  </div>
                ` : `
                  <div class="space-y-2">
                    ${avoidDiagnostics.map((d) => `
                      <div class="bg-white rounded-xl p-3 border ${d.isAdjacent ? 'border-red-400 bg-red-50' : 'border-slate-200'} space-y-1">
                        <div class="flex flex-wrap items-center justify-between gap-1 text-xs sm:text-sm font-extrabold text-slate-900">
                          <span>대상: ${d.otherSt ? `${d.otherSt.id}번 ${escHtml(d.otherSt.name)}` : '-'}</span>
                          <span class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 text-[11px]">${escHtml(d.rankTag)}</span>
                        </div>
                        <div class="text-xs font-extrabold ${d.isAdjacent ? 'text-red-600' : 'text-emerald-700'}">
                          ${escHtml(d.distText)}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>

              <div class="bg-[#FFF9F6] border border-[#FFD2C2] rounded-2xl p-4 space-y-2.5">
                <div class="text-sm font-extrabold text-[#C93B27]">🍑 받은 칭찬 추천 (${receivedPraises.length}표)</div>
                ${receivedPraises.length === 0 ? `
                  <div class="text-xs text-slate-400 bg-white rounded-xl p-3.5 border border-[#FFD2C2]">
                    아직 받은 칭찬 추천이 없습니다.
                  </div>
                ` : `
                  <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    ${receivedPraises.map((p) => `
                      <div class="bg-white rounded-xl p-2.5 border border-[#FFD2C2] space-y-1">
                        <span class="inline-block px-2 py-0.5 rounded bg-[#FFF6F3] text-[#C93B27] text-[11px] font-extrabold">${escHtml(p.badge)}</span>
                        <p class="text-xs font-semibold text-[#54271E]">"${escHtml(p.message)}"</p>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }

      function renderSociogramTab() {
        let mutualPairs = 0;
        let avoidCount = 0;
        const hubScores = {};
        const incomingPrefer = {};
        state.students.forEach((s) => { hubScores[s.id] = 0; incomingPrefer[s.id] = 0; });

        const prefSet = new Set();
        state.students.forEach((s) => {
          const sv = getSurvey(s.id);
          if (!sv) return;
          getPreferIds(sv).forEach((tid) => {
            prefSet.add(`${s.id}->${tid}`);
          });
        });

        for (let i = 0; i < state.students.length; i++) {
          for (let j = i + 1; j < state.students.length; j++) {
            const a = state.students[i].id;
            const b = state.students[j].id;
            if (prefSet.has(`${a}->${b}`) && prefSet.has(`${b}->${a}`)) mutualPairs += 1;
          }
        }

        state.students.forEach((s) => {
          const sv = getSurvey(s.id);
          if (!sv) return;
          getPreferIds(sv).forEach((tid) => {
            if (!tid || hubScores[tid] === undefined) return;
            hubScores[tid] += 2;
            incomingPrefer[tid] += 1;
          });
          getAvoidIds(sv).forEach((tid) => { if (tid) avoidCount += 1; });
          if (sv.bestStudentId && hubScores[sv.bestStudentId] !== undefined) {
            hubScores[sv.bestStudentId] += 2;
          }
        });

        const hubStudent = [...state.students].sort((a, b) => hubScores[b.id] - hubScores[a.id])[0];
        const careStudent = [...state.students].sort((a, b) => incomingPrefer[a.id] - incomingPrefer[b.id])[0];

        const filters = [
          { id: 'all',    label: '전체 관계' },
          { id: 'prefer', label: '💚 선호만' },
          { id: 'avoid',  label: '🚨 기피만' },
          { id: 'praise', label: '🍑 칭찬만' }
        ];

        const zoomPct = Math.round((state.sociogram.zoom || 1) * 100);

        return `
          <main class="max-w-[1440px] w-full mx-auto px-4 sm:px-6 py-6 space-y-5">
            <!-- 4대 핵심 인사이트 카드 -->
            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs">
                <div class="text-xs font-extrabold text-emerald-600">💚 상호 선호 쌍</div>
                <div class="text-2xl font-extrabold text-slate-900 mt-1">${mutualPairs}쌍</div>
                <div class="text-xs text-slate-500 mt-0.5">서로 함께 앉고 싶어하는 단짝 조합</div>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs">
                <div class="text-xs font-extrabold text-red-600">🚨 기피·갈등 건수</div>
                <div class="text-2xl font-extrabold text-slate-900 mt-1">${avoidCount}건</div>
                <div class="text-xs text-slate-500 mt-0.5">자리배치 시 인접 분리 적용 대상</div>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs">
                <div class="text-xs font-extrabold text-indigo-600">🌟 교실 긍정 허브</div>
                <div class="text-xl font-extrabold text-slate-900 mt-1">${hubStudent ? `${hubStudent.id}번 ${escHtml(hubStudent.name)}` : '-'}</div>
                <div class="text-xs text-slate-500 mt-0.5">선호 친구 + 칭찬 추천 최다 득표</div>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs">
                <div class="text-xs font-extrabold text-amber-600">💛 세심한 관찰 필요</div>
                <div class="text-xl font-extrabold text-slate-900 mt-1">${careStudent ? `${careStudent.id}번 ${escHtml(careStudent.name)}` : '-'}</div>

                              ${buildFriendOptions(prefer3, [prefer1, prefer2], allAvoidSelected, '피하기 선택됨')}
                            </select>
                          </div>
                        </div>
                      </div>

                      <div class="bg-[#FFF9F6] border border-[#FFD2C2] rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-extrabold text-red-600">🛡️ 피하고 싶은 친구</span>

                        <p class="text-[11px] text-[#8A5347]">선택한 친구와는 짝꿍 및 상하좌우·대각선 인접 좌석에서 최우선으로 분리됩니다.</p>
                        <div class="space-y-2.5">

                              ${buildFriendOptions(avoid1, [avoid2, avoid3], allPreferSelected, '함께 앉기 선택됨')}

                          <div>
                            <label class="block text-[11px] font-bold text-[#54271E] mb-1">2순위 (선택)</label>
                            <select data-survey-select="avoid2"
                              class="w-full rounded-xl border border-[#FFB399] bg-white px-3 py-2 text-xs sm:text-sm font-bold text-slate-800">
                              ${buildFriendOptions(avoid2, [avoid1, avoid3], allPreferSelected, '함께 앉기 선택됨')}
                            </select>

                          <div>

                      <div class="flex gap-2">
