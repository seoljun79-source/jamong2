                  </div>
                </div>

                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-3">
                  <div class="text-xs font-extrabold text-slate-800">게시 순서: 패들렛 우측 하단 [ + 버튼 ] → [ 🔗 링크 붙여넣기 ] → 저장</div>
                  <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" readonly value="${escHtml(shareUrl)}"
                      class="flex-1 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-mono text-slate-700" />
                    <button type="button" data-action="copy-padlet-link"
                      class="px-4 py-2 rounded-xl bg-gradient-to-r from-[#FF8E7A] to-[#FF6A52] text-white text-xs font-extrabold shrink-0">
                      📋 학생 전용 URL 복사
                    </button>
                  </div>
                </div>

                <div class="flex justify-end">
                  <button type="button" data-action="close-padlet-modal" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold">확인</button>
                </div>
              </div>
            </div>
          `;
        }

        // 3. 교실 TV 시상식 발표 전체 화면 오버레이
        if (state.awardsTv.open) {
          const leaderboard = getAwardLeaderboard();
          const top3 = leaderboard.slice(0, 3);
          const step = state.awardsTv.revealStep;

          const nextBtnText =
            step === 0 ? '🥉 3위 수상자 공개하기!' :
            step === 1 ? '🥈 2위 수상자 공개하기!' :
            step === 2 ? '👑 대망의 1위 수상자 공개하기!' :
            '🎉 모두 축하합니다! (수상자 전원 공개 완료)';

          const displaySlots = [
            { rank: 2, entry: top3[1], visible: step >= 2, badgeText: '🥈 2위', cardStyle: 'border-slate-300 bg-white text-slate-900 py-7' },
            { rank: 1, entry: top3[0], visible: step >= 3, badgeText: '👑 영예의 1위', cardStyle: 'border-amber-400 bg-gradient-to-b from-amber-50 to-white text-slate-900 py-10 shadow-2xl scale-105' },
            { rank: 3, entry: top3[2], visible: step >= 1, badgeText: '🥉 3위', cardStyle: 'border-orange-300 bg-white text-slate-900 py-7' }
          ];

          html += `
            <div class="fixed inset-0 z-50 bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-950 text-white flex flex-col items-center justify-center p-6 overflow-y-auto no-print">
              <button type="button" data-action="close-tv-awards"
                class="fixed top-5 right-5 px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-extrabold">
                ✕ 시상식 닫기
              </button>

              <div class="max-w-4xl w-full text-center space-y-6">
                <div class="space-y-2">
                  <span class="inline-block px-4 py-1 rounded-full bg-white/10 text-amber-300 text-xs font-extrabold tracking-wider">
                    🍑 우리 반 이달의 칭찬 시상식 (${escHtml(state.classCode)})
                  </span>
                  <h2 class="text-2xl sm:text-4xl font-extrabold tracking-tight">
                    선생님의 깜짝 선물을 받을 '최고의 학생'
                  </h2>
                  <p class="text-xs sm:text-sm text-slate-300">버튼을 눌러 3위부터 1위까지 차례로 공개해 주세요!</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-end pt-4">
                  ${displaySlots.map((slot) => {
                    if (!slot.entry) return '';
                    if (!slot.visible) {
                      return `
                        <div class="rounded-3xl border-2 border-dashed border-white/25 bg-white/5 py-10 px-5 text-center space-y-2">
                          <div class="text-base font-extrabold text-amber-300">${slot.badgeText}</div>
                          <div class="text-3xl font-extrabold text-white/40">? ? ?</div>
                          <div class="text-xs text-slate-400">두구두구... 공개 대기 중</div>
                        </div>
                      `;
                    }
                    const mainBadge = Object.entries(slot.entry.badges).sort((a, b) => b[1] - a[1])[0]?.[0] || PRAISE_BADGES[0];
                    return `
                      <div class="rounded-3xl border-2 ${slot.cardStyle} px-5 text-center space-y-2 transition-all duration-500">
                        <div class="text-base font-extrabold text-indigo-700">${slot.badgeText}</div>
                        <div class="text-2xl sm:text-3xl font-extrabold">${slot.entry.student.id}번 ${escHtml(slot.entry.student.name)}</div>
                        <div class="text-sm font-extrabold text-[#C93B27]">${slot.entry.votes}표 득표 · ${escHtml(mainBadge)}</div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="pt-4">
                  <button type="button" data-action="advance-tv-awards"
                    class="px-8 py-4 rounded-2xl bg-gradient-to-r from-[#FF8E7A] to-[#FF6A52] hover:opacity-95 text-white text-base sm:text-lg font-extrabold shadow-xl shadow-rose-500/25">
                    ${nextBtnText}
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        return html;
      }

      function renderApp() {
        const root = document.getElementById('app-root');
        if (!root) return;

        let mainContent = '';
        if (state.studentOnlyMode || state.activeTab === 'student') {
          mainContent = renderStudentTab();
        } else if (state.activeTab === 'roster') {
          mainContent = renderRosterTab();
        } else if (state.activeTab === 'sociogram') {
          mainContent = renderSociogramTab();
        } else if (state.activeTab === 'awards') {
          mainContent = renderAwardsTab();
        } else if (state.activeTab === 'archives') {
          mainContent = renderArchivesTab();
        } else {
          mainContent = renderTeacherTab();
        }

        root.innerHTML = `
          ${renderHeader()}
          ${mainContent}
          ${renderModalsAndOverlays()}
        `;
      }

      /* =====================================================================
         13. 단일 #app-root 이벤트 위임 (addEventListener)
         ===================================================================== */
      function swapTwoSeats(idxA, idxB) {
        [state.seats[idxA], state.seats[idxB]] = [state.seats[idxB], state.seats[idxA]];
        const analysis = analyzeCurrentSeating();
        saveWorkspace();
        renderApp();

        if (analysis.conflictIndices.has(idxA) || analysis.conflictIndices.has(idxB)) {
          showToast('⚠️ 주의: 기피 관계 학생끼리 인접하게 배치되었습니다.', 'warning');
        } else {
          showToast('두 자리를 맞바꾸고 리포트를 재계산했습니다.', 'info');
        }
      }

      function setupEventDelegation() {
        const root = document.getElementById('app-root');
        if (!root) return;

        // 1) Click 이벤트 위임
        root.addEventListener('click', (e) => {
          const socNodeEl = e.target.closest('[data-soc-node-id]');
          if (socNodeEl && !state.sociogram.justDragged) {
            const id = Number(socNodeEl.dataset.socNodeId);
            state.sociogram.focusedId = state.sociogram.focusedId === id ? null : id;
            renderApp();
            return;
          }

          const actionEl = e.target.closest('[data-action]');
          if (!actionEl) return;

          const action = actionEl.dataset.action;
          const val = actionEl.dataset.value;
          const id = Number(actionEl.dataset.id);

          switch (action) {
            case 'switch-tab': {
              if (state.studentOnlyMode && actionEl.dataset.tab !== 'student') return;
              state.activeTab = actionEl.dataset.tab;
              if (state.activeTab === 'sociogram' && Object.keys(state.sociogram.positions).length !== state.students.length) {
                computeSociogramPositions();
              }
              renderApp();
              break;
            }
            case 'switch-class': {
              loadWorkspace(state.classCodeDraft, false);
              safeUpdateUrlParams(state.studentOnlyMode ? 'student' : '', state.classCode);
              renderApp();
              showToast(`🔄 학급 워크스페이스 [${state.classCode}]를 불러왔습니다.`, 'success');
              break;
            }
            case 'copy-class-code': {
              copyTextToClipboard(state.classCode);
              showToast(`학급 코드 [${state.classCode}]가 복사되었습니다.`, 'success');
              break;
            }
            case 'new-class-code': {
              const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
              let code = 'MODU';
              for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
              state.classCodeDraft = code;
              loadWorkspace(code, false);
              safeUpdateUrlParams(state.studentOnlyMode ? 'student' : '', code);
              renderApp();
              showToast(`🆕 새 학급 코드 [${code}]가 생성되었습니다.`, 'success');
              break;
            }
            case 'set-desk-mode': {
              state.deskMode = val;
              // 1인 책상 분단형 기본 5열×6행(30석), 2인 1조 짝꿍형 기본 6열×6행(36석)
              state.cols = val === 'single' ? 5 : 6;
              state.rows = 6;
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'set-cols': {
              state.cols = Number(val);
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'set-rows': {
              state.rows = Number(val);
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'set-strategy': {
              state.strategy = val;
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'toggle-perspective': {
              state.perspective = state.perspective === 'student' ? 'teacher' : 'student';
              renderApp();
              break;
            }
            case 'toggle-tv-hide': {
              state.tvHideSensitive = !state.tvHideSensitive;
              renderApp();
              break;
            }
            case 'run-optimize': {
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'run-optimize-and-go': {
              state.activeTab = 'teacher';
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'export-seating-png': {
              exportSeatingChartPng();
              break;
            }
            case 'download-csv': {
              downloadSeatingCsv();
              break;
            }
            case 'print-chart': {
              window.print();
              break;
            }
            case 'toggle-pin': {
              e.stopPropagation();
              const st = getStudent(id);
              if (!st) return;
              st.pinned = !st.pinned;
              saveWorkspace();
              renderApp();
              showToast(st.pinned ? `📌 ${st.id}번 ${st.name} 학생을 앞자리 고정석으로 지정했습니다.` : `${st.id}번 ${st.name} 학생의 앞자리 고정을 해제했습니다.`, 'info');
              break;
            }
            case 'select-seat': {
              const seatIdx = Number(actionEl.dataset.seatIdx);
              if (state.selectedSeatIdx === null) {
                state.selectedSeatIdx = seatIdx;
                renderApp();
              } else if (state.selectedSeatIdx === seatIdx) {
                state.selectedSeatIdx = null;
                renderApp();
              } else {
                const firstIdx = state.selectedSeatIdx;
                state.selectedSeatIdx = null;
                swapTwoSeats(firstIdx, seatIdx);
              }
              break;
            }
            case 'add-student': {
              const name = state.newStudentName.trim();
              if (!name) {
                showToast('추가할 학생의 이름을 입력해 주세요.', 'warning');
                return;
              }
              const maxId = state.students.reduce((max, s) => Math.max(max, Number(s.id)), 0);
              const nextId = maxId + 1;
              const scoreNum = Math.max(0, Math.min(100, parseInt(state.newStudentScore, 10) || 80));
              state.students.push({
                id: nextId,
                name,
                gender: state.newStudentGender === 'F' ? 'F' : 'M',
                score: scoreNum,
                pinned: false
              });
              state.newStudentName = '';
              state.sociogram.positions = {};
              optimizeSeating(false, true);
              renderApp();
              showToast(`➕ ${nextId}번 ${name} 학생이 추가되었습니다. (총 ${state.students.length}명)`, 'success');
              break;
            }
            case 'prompt-delete-student': {
              state.confirmDeleteStudentId = id;
              renderApp();
              break;
            }
            case 'confirm-delete-student': {
              const target = getStudent(id);
              if (!target) return;
              state.students = state.students.filter((s) => Number(s.id) !== id);
              delete state.surveysMap[id];
              state.confirmDeleteStudentId = null;
              state.sociogram.positions = {};
              optimizeSeating(false, true);
              renderApp();
              showToast(`🗑️ ${target.id}번 ${target.name} 학생이 명단에서 삭제되었습니다.`, 'info');
              break;
            }
            case 'reset-single-survey': {
              const st = getStudent(id);
              if (!st) return;
              delete state.surveysMap[id];
              saveWorkspace();
              renderApp();
              showToast(`${st.id}번 ${st.name} 학생의 설문을 초기화했습니다.`, 'info');
              break;
            }
            case 'fill-sample-excel': {
              const src = state.students.length > 0 ? state.students : SEED_STUDENTS;
              state.excelPasteBuffer = src.map((s) => `${s.id}\t${s.name}\t${s.gender === 'M' ? '남' : '여'}\t${s.score}`).join('\n');
              renderApp();
              break;
            }
            case 'apply-excel-buffer': {
              const lines = state.excelPasteBuffer.trim().split(/\r?\n/).filter(Boolean);
              const parsed = [];
              for (const line of lines) {
                const parts = line.includes('\t') ? line.split('\t') : line.split(',');
                if (parts.length < 4) continue;
                const sId = parseInt(parts[0].trim(), 10);
                const name = parts[1].trim();
                const genderRaw = parts[2].trim();
                const score = parseFloat(parts[3].trim());
                if (isNaN(sId) || !name || isNaN(score)) continue;
                const prev = getStudent(sId);
                parsed.push({
                  id: sId,
                  name,
                  gender: (genderRaw === '여' || genderRaw.toUpperCase() === 'F') ? 'F' : 'M',
                  score: Math.max(0, Math.min(100, Math.round(score))),
                  pinned: prev ? prev.pinned : false
                });
              }
              if (parsed.length === 0) {
                showToast('형식(학번, 이름, 성별, 성적)을 확인해 주세요.', 'warning');
                return;
              }
              state.students = parsed.sort((a, b) => a.id - b.id);
              state.excelPasteBuffer = '';
              state.sociogram.positions = {};
              state.activeTab = 'teacher';
              optimizeSeating(true, true);
              renderApp();
              break;
            }
            case 'open-padlet-modal': {
              state.modals.padletGuide = true;
              renderApp();
              break;
            }
            case 'close-padlet-modal': {
              state.modals.padletGuide = false;
              renderApp();
              break;
            }
            case 'copy-padlet-link': {
              copyTextToClipboard(getPadletStudentUrl());
              showToast('📌 패들렛 게시용 학생 전용 URL이 복사되었습니다!', 'success');
              break;
            }
            case 'enter-student-mode': {
              state.studentOnlyMode = true;
              state.activeTab = 'student';
              state.modals.unlockPrompt = false;
              safeUpdateUrlParams('student', state.classCode);
              const pending = state.students.find((s) => !getSurvey(s.id));
              if (pending) state.survey.selectedId = pending.id;
              renderApp();
              break;
            }
            case 'toggle-unlock-prompt': {
              state.modals.unlockPrompt = !state.modals.unlockPrompt;
              state.modals.unlockInput = '';
              renderApp();
              break;
            }
            case 'submit-unlock-pin': {
              if (state.modals.unlockInput.trim() === state.teacherPin) {
                state.studentOnlyMode = false;
                state.modals.unlockPrompt = false;
                state.activeTab = 'teacher';
                safeUpdateUrlParams('', state.classCode);
                renderApp();
                showToast('👩‍🏫 교사 관리 화면으로 복귀했습니다.', 'success');
              } else {
                showToast(`PIN 코드가 일치하지 않습니다. (기본 PIN: ${state.teacherPin})`, 'warning');
              }
              break;
            }
            case 'survey-step': {
              const nextStep = Number(val);
              const st = getStudent(state.survey.selectedId);
              if (nextStep > 1) {
                if (state.survey.codeInput.trim().toUpperCase() !== state.classCode) {
                  showToast(`학급 코드가 일치하지 않습니다. (${state.classCode})`, 'warning');
                  return;
                }
                if (!st || getSurvey(st.id)) {
                  showToast('이미 설문을 제출한 학생입니다. 다른 번호를 선택해 주세요.', 'warning');
                  return;
                }
              }
              state.survey.step = nextStep;
              renderApp();
              break;
            }
            case 'select-praise-badge': {
              state.survey.bestBadge = val;
              renderApp();
              break;
            }
            case 'submit-survey': {
              const st = getStudent(state.survey.selectedId);
              if (!st) return;

              const p1 = Number(state.survey.prefer1) || null;
              const p2 = Number(state.survey.prefer2) || null;
              const p3 = Number(state.survey.prefer3) || null;
              const a1 = Number(state.survey.avoid1) || null;
              const a2 = Number(state.survey.avoid2) || null;
              const a3 = Number(state.survey.avoid3) || null;

              const entry = {
                studentId: st.id,
                prefer: [p1, p2, p3].filter(Boolean),
                avoid: [a1, a2, a3].filter(Boolean),
                prefer1: p1,
                prefer2: p2,
                prefer3: p3,
                avoid1: a1,
                avoid2: a2,
                avoid3: a3,
                bestStudentId: Number(state.survey.bestStudentId) || null,
                bestBadge: state.survey.bestStudentId ? (state.survey.bestBadge || PRAISE_BADGES[0]) : null,
                bestMessage: state.survey.bestStudentId ? state.survey.bestMessage.trim() : '',
                submittedAt: new Date().toISOString()
              };

              state.surveysMap[st.id] = entry;
              saveWorkspace();

              state.survey.completedStudent = { id: st.id, name: st.name };
              renderApp();
              showToast(`🍑 ${st.id}번 ${st.name} 학생의 비밀 설문이 암호화 제출되었습니다!`, 'peach');
              break;
            }
            case 'survey-next-student': {
              const nextPending = state.students.find((s) => !getSurvey(s.id));
              state.survey.selectedId = nextPending ? nextPending.id : (state.students[0]?.id || 1);
              state.survey.prefer1 = '';
              state.survey.prefer2 = '';
              state.survey.prefer3 = '';
              state.survey.avoid1 = '';
              state.survey.avoid2 = '';
              state.survey.avoid3 = '';
              state.survey.bestStudentId = '';
              state.survey.bestBadge = PRAISE_BADGES[0];
              state.survey.bestMessage = '';
              state.survey.completedStudent = null;
              state.survey.step = 1;
              renderApp();
              break;
            }
            case 'set-soc-filter': {
              state.sociogram.filter = val;
              renderApp();
              break;
            }
            case 'set-soc-layout': {
              state.sociogram.layout = val;
              computeSociogramPositions();
              saveWorkspace();
              renderApp();
              break;
            }
            case 'soc-zoom-in': {
              state.sociogram.zoom = Math.min(1.5, Math.round(((state.sociogram.zoom || 1) + 0.15) * 100) / 100);
              renderApp();
              break;
            }
            case 'soc-zoom-out': {
              state.sociogram.zoom = Math.max(0.8, Math.round(((state.sociogram.zoom || 1) - 0.15) * 100) / 100);
              renderApp();
              break;
            }
            case 'soc-auto-arrange': {
              computeSociogramPositions();
              state.sociogram.zoom = 1;
              saveWorkspace();
              renderApp();
              showToast('🔄 모든 학생 노드가 겹침 없이 자동 정돈되었습니다.', 'info');
              break;
            }
            case 'toggle-soc-fullscreen': {
              state.sociogram.fullscreen = !state.sociogram.fullscreen;
              toggleNativeFullscreenSafe(state.sociogram.fullscreen);
              renderApp();
              break;
            }
            case 'clear-soc-focus': {
              state.sociogram.focusedId = null;
              renderApp();
              break;
            }
            case 'export-soc-png': {
              exportSociogramPng();
              break;
            }
            case 'open-tv-awards': {
              state.awardsTv.open = true;
              state.awardsTv.revealStep = 0;
              renderApp();
              break;
            }
            case 'close-tv-awards': {
              state.awardsTv.open = false;
              renderApp();
              break;
            }
            case 'advance-tv-awards': {
              if (state.awardsTv.revealStep < 3) {
                state.awardsTv.revealStep += 1;
                renderApp();
                if (state.awardsTv.revealStep === 3) launchCelebrationConfetti();
              }
              break;
            }
            case 'save-archive': {
              const title = state.archiveTitleInput.trim() || `${new Date().getFullYear()}년 ${new Date().getMonth() + 1}월 자리배치`;
              const analysis = analyzeCurrentSeating();
              const record = {
                id: `arc_${Date.now()}`,
                title,
                savedAt: new Date().toISOString(),
                deskMode: state.deskMode,
                cols: state.cols,
                rows: state.rows,
                strategy: state.strategy,
                seats: [...state.seats],
                stats: {
                  matchedPairs: analysis.matchedPairs,
                  totalPairs: analysis.totalPairs,
                  conflictPairs: analysis.conflictPairs,
                  preferRate: analysis.preferRate
                }
              };
              state.archives.unshift(record);
              saveWorkspace();
              renderApp();
              showToast(`💾 '${title}' 기록이 저장되었습니다!`, 'success');
              break;
            }
            case 'restore-archive': {
              const targetId = actionEl.dataset.id;
              const arc = state.archives.find((a) => a.id === targetId);
              if (!arc) return;
              state.deskMode = arc.deskMode || 'single';
              state.cols = Number(arc.cols) || 5;
              state.rows = Number(arc.rows) || 6;
              state.strategy = arc.strategy || 'mentor';
              state.seats = Array.isArray(arc.seats) ? [...arc.seats] : [];
              state.activeTab = 'teacher';
              saveWorkspace();
              renderApp();
              showToast(`📂 '${arc.title}' 자리배치를 불러왔습니다!`, 'success');
              break;
            }
            case 'prompt-delete-archive': {
              state.confirmDeleteArchiveId = actionEl.dataset.id;
              renderApp();
              break;
            }
            case 'confirm-delete-archive': {
              const targetId = actionEl.dataset.id;
              state.archives = state.archives.filter((a) => a.id !== targetId);
              state.confirmDeleteArchiveId = null;
              saveWorkspace();
              renderApp();
              showToast('과거 자리배치 기록을 삭제했습니다.', 'info');
              break;
            }
            case 'prompt-reset-round': {
              state.confirmResetRound = true;
              renderApp();
              break;
            }
            case 'cancel-reset-round': {
              state.confirmResetRound = false;
              renderApp();
              break;
            }
            case 'confirm-reset-round': {
              state.surveysMap = {};
              state.confirmResetRound = false;
              saveWorkspace();
              renderApp();
              showToast('🌱 다음 달 새 설문 회차가 시작되었습니다! (명단·성적·저장소 유지)', 'success');
              break;
            }
            case 'download-json-backup': {
              downloadJsonBackup();
              break;
            }
            case 'seed-demo-data': {
              applySeedData();
              state.deskMode = 'single';
              state.cols = 5;
              state.rows = 6;
              optimizeSeating(false, true);
              renderApp();
              showToast('✨ 가상 중학생 25명 시드 데이터로 초기화했습니다.', 'success');
              break;
            }
          }
        });

        // 2) Input 이벤트 위임 (타이핑 중 포커스 유지를 위해 상태만 즉시 갱신)
        root.addEventListener('input', (e) => {
          const field = e.target.dataset.field;
          if (field) {
            state[field] = e.target.value;
            return;
          }
          const modalField = e.target.dataset.modalField;
          if (modalField) {
            state.modals[modalField] = e.target.value;
            return;
          }
          const surveyField = e.target.dataset.surveyField;
          if (surveyField) {
            state.survey[surveyField] = e.target.value;
          }
        });

        // 3) Keydown (Enter 키 단축 실행)
        root.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          const enterAction = e.target.dataset.enterAction;
          if (!enterAction) return;
          const btn = root.querySelector(`[data-action="${enterAction}"]`);
          if (btn) btn.click();
        });

        // 4) Change 이벤트 위임 (Select 드롭다운, 이름/성별/성적 수정, 파일 업로드)
        root.addEventListener('change', (e) => {
          const rosterSelect = e.target.dataset.rosterSelect;
          if (rosterSelect) {
            state[rosterSelect] = e.target.value;
            return;
          }

          const surveySelect = e.target.dataset.surveySelect;
          if (surveySelect) {
            if (surveySelect === 'studentId') {
              state.survey.selectedId = Number(e.target.value);
              state.survey.prefer1 = '';
              state.survey.prefer2 = '';
              state.survey.prefer3 = '';
              state.survey.avoid1 = '';
              state.survey.avoid2 = '';
              state.survey.avoid3 = '';
              state.survey.bestStudentId = '';
              state.survey.bestBadge = PRAISE_BADGES[0];
              state.survey.bestMessage = '';
              state.survey.completedStudent = null;
              state.survey.step = 1;
            } else {
              state.survey[surveySelect] = e.target.value;
            }
            renderApp();
            return;
          }

          const nameStudentId = e.target.dataset.nameStudentId;
          if (nameStudentId) {
            const st = getStudent(nameStudentId);
            const val = e.target.value.trim();
            if (st && val) {
              st.name = val;
              saveWorkspace();
              renderApp();
              showToast(`${st.id}번 학생의 이름이 '${st.name}'으로 수정되었습니다.`, 'info');
            }
            return;
          }

          const genderStudentId = e.target.dataset.genderStudentId;
          if (genderStudentId) {
            const st = getStudent(genderStudentId);
            if (st) {
              st.gender = e.target.value === 'F' ? 'F' : 'M';
              saveWorkspace();
              renderApp();
            }
            return;
          }

          const scoreStudentId = e.target.dataset.scoreStudentId;
          if (scoreStudentId) {
            const st = getStudent(scoreStudentId);
            if (st) {
              const num = Math.max(0, Math.min(100, parseInt(e.target.value, 10) || 0));
              st.score = num;
              saveWorkspace();
              renderApp();
              showToast(`${st.id}번 ${st.name} 학생의 성적이 ${num}점으로 저장되었습니다.`, 'info');
            }
            return;
          }

          const fileAction = e.target.dataset.fileAction;
          if (fileAction === 'upload-csv' && e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              state.excelPasteBuffer = String(ev.target.result || '');
              renderApp();
              showToast('📂 CSV 파일을 불러왔습니다. [일괄 업데이트 반영하기]를 눌러 적용하세요.', 'info');
            };
            reader.readAsText(e.target.files[0], 'UTF-8');
            return;
          }

          if (fileAction === 'restore-json-backup' && e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const parsed = JSON.parse(String(ev.target.result || '{}'));
                if (!parsed || !Array.isArray(parsed.students)) {
                  showToast('올바른 모두의자리 JSON 백업 파일이 아닙니다.', 'warning');
                  return;
                }
                const targetCode = parsed.classCode || state.classCode;
                state.classCode = targetCode;
                state.classCodeDraft = targetCode;
                state.teacherPin = parsed.teacherPin || '1234';
                state.deskMode = parsed.deskMode || 'single';
                state.cols = Number(parsed.cols) || 5;
                state.rows = Number(parsed.rows) || 6;
                state.strategy = parsed.strategy || 'mentor';
                state.students = parsed.students;
                state.surveysMap = parsed.surveysMap || {};
                state.seats = Array.isArray(parsed.seats) ? parsed.seats : [];
                state.archives = Array.isArray(parsed.archives) ? parsed.archives : [];
                state.sociogram.positions = parsed.sociogramPositions || {};
                saveWorkspace();
                renderApp();
                showToast(`✅ 백업 파일([${targetCode}], 학생 ${state.students.length}명)이 완벽히 복원되었습니다!`, 'success');
              } catch (err) {
                showToast('JSON 파일을 읽는 중 오류가 발생했습니다.', 'warning');
              }
            };
            reader.readAsText(e.target.files[0], 'UTF-8');
          }
        });

        // 5) 교실 자리배치 카드 드래그 앤 드롭 위임
        root.addEventListener('dragstart', (e) => {
          const card = e.target.closest('[data-seat-idx]');
          if (!card) return;
          state.dragSourceIdx = Number(card.dataset.seatIdx);
          if (e.dataTransfer) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(state.dragSourceIdx));
          }
        });

        root.addEventListener('dragover', (e) => {
          const card = e.target.closest('[data-seat-idx]');
          if (!card) return;
          e.preventDefault();
          card.classList.add('desk-drag-over');
        });

        root.addEventListener('dragleave', (e) => {
          const card = e.target.closest('[data-seat-idx]');
          if (card) card.classList.remove('desk-drag-over');
        });

        root.addEventListener('drop', (e) => {
          const card = e.target.closest('[data-seat-idx]');
          if (!card) return;
          e.preventDefault();
          card.classList.remove('desk-drag-over');
          const targetIdx = Number(card.dataset.seatIdx);
          const sourceIdx = state.dragSourceIdx;
          state.dragSourceIdx = null;
          if (sourceIdx !== null && sourceIdx !== targetIdx) {
            state.selectedSeatIdx = null;
            swapTwoSeats(sourceIdx, targetIdx);
          }
        });

        // 6) 인물관계도 SVG 학생 원(Node) 드래그 이동 (마우스 & 터치 통합 Pointer 이벤트)
        root.addEventListener('pointerdown', (e) => {
          const nodeEl = e.target.closest('[data-soc-node-id]');
          if (!nodeEl) return;
          state.sociogram.draggingId = Number(nodeEl.dataset.socNodeId);
          state.sociogram.justDragged = false;
        });

        window.addEventListener('pointermove', (e) => {
          if (!state.sociogram.draggingId) return;
          const svgEl = document.getElementById('sociogram-svg');
          if (!svgEl) return;
          const rect = svgEl.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;

          const x = ((e.clientX - rect.left) / rect.width) * 1440;
          const y = ((e.clientY - rect.top) / rect.height) * 960;
          const pos = state.sociogram.positions[state.sociogram.draggingId];
          if (pos) {
            if (Math.hypot(pos.x - x, pos.y - y) > 4) {
              state.sociogram.justDragged = true;
            }
            pos.x = Math.max(85, Math.min(1355, x));
            pos.y = Math.max(130, Math.min(895, y));
            renderApp();
          }
        });

        window.addEventListener('pointerup', () => {
          if (state.sociogram.draggingId) {
            if (state.sociogram.justDragged) saveWorkspace();
            state.sociogram.draggingId = null;
            setTimeout(() => { state.sociogram.justDragged = false; }, 60);
          }
        });
      }

      /* =====================================================================
         14. 애플리케이션 초기화 부트스트랩
         ===================================================================== */
      function initApp() {
        const params = safeReadUrlParams();
        const initialCode = params.code || 'MODU2026';
        loadWorkspace(initialCode, true);

        if (params.mode === 'student') {
          state.studentOnlyMode = true;
          state.activeTab = 'student';
        }

        setupEventDelegation();
        renderApp();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
